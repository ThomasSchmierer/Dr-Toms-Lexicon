name: 1. Harvest words

on:
  schedule:
    - cron: "17 16 * * *"     # every night at 2:17 am Brisbane time
  workflow_dispatch:
    inputs:
      source:
        description: "Where to look (overnight = run tonight's queued batch now)"
        type: choice
        options: [wikiquote, gutenberg, overnight]
        default: wikiquote
      pages:
        description: "Wikiquote pages separated by semicolons (e.g. Frasier; Yes Minister). Leave empty to harvest the whole queue in tools/shows.txt"
        required: false
      book_number:
        description: "Gutenberg only: book number (e.g. 1342 for Pride and Prejudice)"
        required: false
      title:
        description: "Gutenberg only: book title"
        required: false
      author:
        description: "Gutenberg only: author"
        required: false
      max_rarity:
        description: "How rare (lower = rarer words; 3.0 is a good start)"
        default: "3.0"

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      SOURCE: ${{ inputs.source }}
      PAGES: ${{ inputs.pages }}
      BOOK: ${{ inputs.book_number }}
      TITLE: ${{ inputs.title }}
      AUTHOR: ${{ inputs.author }}
      RARITY: ${{ inputs.max_rarity }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r tools/requirements.txt
      - name: Harvest
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$SOURCE" = "overnight" ]; then
            python tools/harvest.py nightly --shows 10 --books 1
          elif [ "$SOURCE" = "wikiquote" ]; then
            args=()
            IFS=';' read -ra parts <<< "$PAGES"
            for p in "${parts[@]}"; do
              t="${p#"${p%%[![:space:]]*}"}"; t="${t%"${t##*[![:space:]]}"}"
              [ -n "$t" ] && args+=("$t")
            done
            if [ ${#args[@]} -eq 0 ]; then
              echo "No pages typed, so harvesting the queue in tools/shows.txt"
              python tools/harvest.py wikiquote --from-file tools/shows.txt --max-rarity "$RARITY"
            else
              python tools/harvest.py wikiquote "${args[@]}" --max-rarity "$RARITY"
            fi
          else
            if [ -z "$BOOK" ] || [ -z "$TITLE" ] || [ -z "$AUTHOR" ]; then
              echo "::error::For a Gutenberg book, fill in the book number, title and author."
              exit 1
            fi
            python tools/harvest.py gutenberg "$BOOK" --title "$TITLE" --author "$AUTHOR" --max-rarity "$RARITY"
          fi
      - name: Check new words in two dictionaries and approve the good ones
        continue-on-error: true
        run: |
          python -m nltk.downloader -q wordnet averaged_perceptron_tagger_eng
          python tools/review.py all
      - name: Save the spreadsheets and approved words to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest; git add approved-*.json xref.json counts.json 2>/dev/null || true
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$SOURCE" = "overnight" ]; then msg="Harvest: overnight run"; else msg="Harvest: $SOURCE $PAGES$TITLE"; fi
          git diff --cached --quiet || git commit -m "$msg"
          git push
