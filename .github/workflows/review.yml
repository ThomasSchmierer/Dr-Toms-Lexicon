name: 3. Check and approve words

# Runs by itself after every overnight harvest. Run it by hand to re-check everything now.
on:
  workflow_dispatch:
    inputs:
      step:
        description: "all = look up new words on Wiktionary, then decide (approve = decide only, using the saved lookups)"
        type: choice
        options: [all, approve, fetch, raw]
        default: all
      words:
        description: "raw only: words to print from Wiktionary (for checking)"
        required: false

permissions:
  contents: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      STEP: ${{ inputs.step || 'all' }}
      WORDS: ${{ inputs.words }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r tools/requirements.txt
          python -m nltk.downloader -q wordnet averaged_perceptron_tagger_eng
      - name: Check every word in two dictionaries and approve the good ones
        run: python tools/review.py "$STEP" $WORDS
      - name: Publish approved words to the game
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add harvest; git add approved-*.json xref.json counts.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Review: check and approve harvested words"
          git pull --rebase -q origin main
          git push
