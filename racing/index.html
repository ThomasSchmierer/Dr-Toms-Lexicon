      poolflucs: `<b>Pool Flucs</b> (now ${showPool ? "on" : "off"}). Shows how the approximate pool dividends have moved as money came in.`,
      fixedhdr: `<b>FIXED ODDS.</b> The TAB bookmakers' prices, locked in when your bet is accepted. Add 1 ÷ price down the Win column: ${pct(fixB)}, so the margin in this practice market is ${pct(fixB - 1)}. Small or overseas races often carry more.`,
      poolhdr: `<b>POOL.</b> The TAB's name for the tote. These are <b>approximate dividends</b>: what $1 would pay if betting closed now. They're final only after the race. Since October 2026 this is One Pool, a single national pool with a 14.5% win takeout. Adding 1 ÷ dividend down the Win column gives ${pct(poolB)}.`,
      num: r && `<b>Number ${r.n}.</b> The saddlecloth number (the dark box), used for exotics and quaddies. Tap the arrow under it on the real page to open that runner's full form.`,
      name: r && `<b>${r.h}.</b> Runner names are shown in capitals, with the barrier in brackets.`,
      bar: r && `<b>Barrier ${r.bar}.</b> The starting stall, in brackets after the name (Chapter 1).`,
      jockey: r && `<b>J ${r.j}.</b> The jockey. ${/\(a(\d)\)/.test(r.j) ? `(a${r.j.match(/\(a(\d)\)/)[1]}) is an apprentice claiming ${r.j.match(/\(a(\d)\)/)[1]} kg, so the horse carries ${r.wt - r.j.match(/\(a(\d)\)/)[1]} kg instead of ${r.wt} kg.` : "No apprentice claim."}`,
      trainer: r && `<b>T ${r.t}.</b> The trainer. When one stable has more than one runner, compare how the market rates each.`,
      form: r ? `<b>Form ${r.form}.</b> Recent finishes, oldest left, newest right; x is a spell, 0 is 10th or worse (Chapter 1). Letters such as the "f" that starts each line in some overseas races are explained in the TAB's footnote, linked from the * on the Form* heading.` : `<b>Form*.</b> Recent finishing positions, newest on the right. The * links to the TAB's key for any letters in the form line.`,
      wt: r ? `<b>${r.wt} kg.</b> The weight allotted, before any apprentice claim.` : `<b>Weight.</b> The weight each horse carries, in kg.`,
      fw: r && `<b>Fixed Win ${money(r.fw)}.</b> Locked in when you bet; $10 returns ${money(10 * r.fw)}. Implied ${pct(1 / r.fw)}, or ${pct(1 / r.fw / fixB)} with the ${pct(fixB - 1)} margin removed.${r === fav ? " Shown in blue because it's the favourite." : ""} It opened at ${money(r.open)}${r.fw < r.open ? " and has firmed" : r.fw > r.open ? " and has drifted" : ""}.`,
      fp: r && `<b>Fixed Place ${money(r.fp)}.</b> Paid if it finishes in the places (top three with 8 or more starters). $10 returns ${money(10 * r.fp)}.`,
      pw: r && `<b>Pool Win ${money(r.pw)} (approx.).</b> ${r.pw > 50 ? `A very long dividend like this usually means almost no money has been bet on it yet; a single bet can move it a lot.` : r.pw > r.fw ? `Above the fixed ${money(r.fw)} right now, but late money often shrinks pool dividends.` : `Below the fixed ${money(r.fw)}: the pool punters like this horse more than the TAB's bookmakers do, so fixed pays more right now.`}`,
      pp: r && (r.pp === 0 ? `<b>Pool Place 0.00.</b> No approximate dividend yet, usually because little or no money is in the place pool on this runner. It isn't a real price: wait for the pool to build.`
        : r.pp <= 1.04 ? `<b>Pool Place ${d(r.pp)}.</b> The minimum dividend. So much is bet on this horse to place that the pool can barely pay a profit, so the TAB pays its minimum. A place bet here would return only $${(10 * r.pp).toFixed(2)} for $10.`
        : `<b>Pool Place ${money(r.pp)} (approx.).</b> The place pool shared three ways (Chapter 9). The final figure depends on which other horses fill the places, so it can differ a lot from the fixed place price (${money(r.fp)}).`),

W.fixtote = el => {
  const b = box(el, "Fixed vs tote vs exchange", `<div class="fields">${field("ft1","TAB fixed win ($)","4.80")}${field("ft2","Tote approx. win ($)","5.20")}${field("ft3","Exchange best back ($)","5.00")}${field("ft4","Exchange commission (%)","8")}${field("ft5","Stake ($)","10")}</div><div class="out" id="fto"></div>`);
  wire(b, () => {
    const f = num($("#ft1", b).value), t = num($("#ft2", b).value), x = num($("#ft3", b).value), c = num($("#ft4", b).value) / 100, s = num($("#ft5", b).value);
    const xe = x > 1 && c >= 0 ? 1 + (x - 1) * (1 - c) : NaN;
    const opts = [["TAB fixed", f, "locked in"], ["Tote (approx.)", t, "may move"], ["Exchange after commission", xe, "locked in if matched"]].filter(o => o[1] > 1);
    if (!opts.length){ $("#fto", b).innerHTML = ""; return; }
    const best = opts.reduce((a, o) => o[1] > a[1] ? o : a);
    $("#fto", b).innerHTML = opts.map(o => stat(o[0] + " · " + o[2], money(o[1]) + (isFinite(s) ? " → " + money(s * o[1]) : ""), o === best ? "hi good" : "")).join("") +
      `<p class="note" style="grid-column:1/-1">Best right now: <b>${best[0]}</b>. ${best[0].startsWith("Tote") ? "But the tote figure is only an estimate: if late money comes for this horse it will shrink, so a fixed price close to it is often the safer choice." : ""}</p>`;
  });
};


W.usform = el => {
  const b = box(el, "US form line decoder", `<label class="f">Paste a form line<textarea id="usf" rows="4" style="font:500 14px var(--body);padding:9px 10px;border-radius:9px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);width:100%">2y filly: 1 win/2 runs, $27k 2026: 1.3/1, 5.5 lengths 4th of 9 to Q's Disco Dancer in $102k stks (6f dirt) at Horseshoe Indianapolis, 44 days ago: front-runner.</textarea></label><div id="usfo" style="margin-top:10px"></div>`);
  const RT = {stks:"Stakes race (high class)", mdn:"Maiden (non-winners)", clm:"Claiming race (lower class)", alw:"Allowance race (middle class)", msw:"Maiden special weight", hcp:"Handicap"};
  const STYLE = [["front-runner","Leader"],["races close to pace","On-pace"],["tracks pace","On-pace (sits just behind the leaders)"],["mid to rear","Midfield to back"],["mid-field","Midfield"],["races behind","Backmarker"]];
  wire(b, () => {
    const t = $("#usf", b).value, rows = [], m = (re) => t.match(re);
    let x;
    if (x = m(/(\d+)y\s+(filly|colt|gelding|mare|horse|mare)/i)) rows.push(["Age and sex", `${x[1]}-year-old ${x[2].toLowerCase()}`]);
    if (x = m(/(\d+)\s+wins?\/(\d+)\s+runs?/i)) rows.push(["Career record", `${x[2]}:${x[1]} (Australian notation), a ${pct(+x[1] / +x[2], 0)} win strike rate`]);
    if (x = m(/\$(\d+(?:\.\d+)?)k\s+\d{4}:/i)) rows.push(["Prize money", `$${(+x[1]).toLocaleString()},000 (US dollars)`]);
    if (x = m(/\d{4}:\s*([\d.]+)\/([\d.]+)/)) { const d = 1 + (+x[1]) / (+x[2]); rows.push(["Starting odds last run", `${x[1]}/${x[2]} = decimal ${money(d)}, about ${pct(1 / d, 0)} implied`]); }
    if (x = m(/([\d.]+)\s+lengths?\s+(\d+)(?:st|nd|rd|th)\s+of\s+(\d+)\s+(to|from)\s+(.+?)\s+in\b/i)) {
      const won = x[4].toLowerCase() === "from";
      rows.push(["Result", won ? `<b>Won</b> by ${x[1]} lengths (about ${(x[1] * 2.4).toFixed(1)} m) from ${x[5]}, in a field of ${x[3]}` : `Finished ${x[2]}${["th","st","nd","rd"][(x[2] % 100 - 20) % 10] || ["th","st","nd","rd"][x[2]] || "th"} of ${x[3]}, beaten ${x[1]} lengths (about ${(x[1] * 2.4).toFixed(1)} m) by the winner, ${x[5]}`]);
    }
    if (x = m(/\$(\d+)k\s+(stks|mdn|clm|alw|msw|hcp)/i)) rows.push(["Race type", `${RT[x[2].toLowerCase()]}, $${x[1]},000 purse`]);
    if (x = m(/\(([\d.]+)f\s+(dirt|turf|synthetic|tapeta)\)/i)) rows.push(["Distance and surface", `${x[1]} furlongs ≈ ${Math.round(x[1] * 201.17)} m, on ${x[2].toLowerCase()}`]);
    if (x = m(/(\d+)\s+days ago/i)) rows.push(["Days since that run", x[1]]);
    const st = STYLE.find(([k]) => t.toLowerCase().includes(k)); if (st) rows.push(["Run style", st[1]]);
    if (x = m(/best (?:effort|form) at ([\d.]+)f/i)) rows.push(["Best distance", `${x[1]}f ≈ ${Math.round(x[1] * 201.17)} m`]);
    if (x = m(/effective from ([\d.]+)f to ([\d.]+)f/i)) rows.push(["Distance range", `${Math.round(x[1] * 201.17)}–${Math.round(x[2] * 201.17)} m`]);
    if (/plenty to spare/i.test(t)) rows.push(["Comment", "Won easily, with more to give"]);
    if (/inconsistent/i.test(t)) rows.push(["Comment", "Form goes up and down"]); else if (/consistent/i.test(t)) rows.push(["Comment", "Runs to a similar level each time"]);
    if (x = m(/([A-Z][\w']+)\s+-\s+([A-Z][\w' ]+?):/)) rows.push(["Breeding", `By ${x[1]} (sire) out of ${x[2]} (dam)`]);
    $("#usfo", b).innerHTML = rows.length ? `<div class="tbl"><table><tr><th>Item</th><th>In plain terms</th></tr>${rows.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join("")}</table></div>` : `<p class="note">Paste a line like the example to decode it.</p>`;
  });
};

}

function quiz(i){
  const c = CH[i], host = $("#qz"); let right = 0, answered = 0;
  host.innerHTML = c.quiz.map((q, k) => `<div class="qn">Question ${k + 1}</div><div class="q">${q.q}</div><div class="opts" data-k="${k}">${q.o.map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join("")}</div><div class="why" hidden></div>`).join("") + `<div class="score" id="qs"></div>`;
  $$(".opts", host).forEach(g => g.addEventListener("click", e => {
    const btn = e.target.closest(".opt"); if (!btn) return;
    const q = c.quiz[+g.dataset.k], j = +btn.dataset.j;
    $$(".opt", g).forEach(x => { x.disabled = true; if (+x.dataset.j === q.a) x.classList.add("right"); });
    if (j === q.a) right++; else btn.classList.add("wrong");
    const why = g.nextElementSibling; why.hidden = false; why.innerHTML = (j === q.a ? "<b>Right.</b> " : "<b>Not quite.</b> ") + q.why;
    if (++answered === c.quiz.length){
      const pass = right >= Math.ceil(c.quiz.length * .75);
      if (pass){ state.done[c.id] = true; save(); progress(); }
      $("#qs").innerHTML = `${right} / ${c.quiz.length}. ${pass ? "Chapter ticked off ✓" : "Have another look and try again."} <button class="btn" id="qr" style="margin-left:8px">Retry</button>`;
      $("#qr").onclick = () => quiz(i);
    }
  }));
}

    ${list.map(([w, t, id]) => { const ci = CH.findIndex(c => c.id === id); return `<div id="t-${w}"><div data-w="${w}"></div><p class="note" style="margin-top:-12px">Explained in <a href="#${id}">Chapter ${ci + 1}: ${CH[ci].title}</a>.</p></div>`; }).join("")}`;
}
function formulas(){
  return `<a class="back" href="#">← All chapters</a><div class="ch-head"><div><small>Quick reference</small><h1>Formula sheet</h1></div></div>
    <div class="tbl"><table><tr><th>What</th><th>Formula</th><th>Example</th></tr>${FORMULAS.map(r => `<tr><td><b>${r[0]}</b></td><td style="font-family:var(--mono);font-size:14px">${r[1]}</td><td style="font-family:var(--mono);font-size:14px">${r[2]}</td></tr>`).join("")}</table></div>`;
}
function glossary(){
  return `<a class="back" href="#">← All chapters</a><div class="ch-head"><div><small>Quick reference</small><h1>Glossary</h1></div></div>
    <div class="search"><input id="gs" placeholder="Search terms…" aria-label="Search the glossary" style="font-family:var(--body)"></div><div class="tbl"><table id="gt"></table></div>`;
}
function fillGlossary(){
  const draw = () => { const q = $("#gs").value.trim().toLowerCase();
    const rows = GLOSSARY.filter(([t, d]) => !q || t.toLowerCase().includes(q) || d.toLowerCase().includes(q));
    $("#gt").innerHTML = `<tr><th>Term</th><th>Meaning</th></tr>` + (rows.length ? rows.map(([t, d]) => `<tr><td><b>${t}</b></td><td>${d}</td></tr>`).join("") : `<tr><td colspan="2">No matches.</td></tr>`); };
  $("#gs").addEventListener("input", draw); draw();
}


/* ---------- hover / tap definitions ---------- */
const AMBIG = new Set(["back","lay","box","firm","drift","length","dam","matched","spread","leader","stakes (stks)","price","return","stake","market","field","pool","tick","favourite","outsider","spell","rig","plunge","stewards","punter","tote","dividend","lay book %","back book %","handicap","futures","the jump","in-play","maiden","place"]);
const TERMS = (() => {
  const list = [];
  GLOSSARY.forEach(([t, d]) => {
    const base = t.replace(/\s*\(.*?\)\s*/g, " ").replace(/\s*%$/, "").trim(), paren = (t.match(/\(([^)]+)\)/) || [])[1];
    const vars = new Set([base]); if (paren && !/^\d|^stks$/i.test(paren)) vars.add(paren);
    const amb = AMBIG.has(t.toLowerCase()) || AMBIG.has(base.toLowerCase());
    vars.forEach(v => list.push({v, d, t, amb}));
  });
  list.sort((a, b) => b.v.length - a.v.length);
  return list;
})();
const esc = x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const TERM_RE = new RegExp("\\b(" + TERMS.filter(x => !x.amb).map(x => esc(x.v) + "(?:e?s)?").join("|") + ")\\b", "i");
const findTerm = txt => { const l = txt.toLowerCase(); return TERMS.find(x => l === x.v.toLowerCase() || l === x.v.toLowerCase() + "s" || l === x.v.toLowerCase() + "es"); };
function addTerms(root){
  const SKIP = "a,h1,h2,h3,button,.quiz,.formula,[data-w],.w,.term,.extras,.chapters,.toc,.pager,.back,label,th,script,style,svg,.ch-head";
  const used = new Set();
  // bold words that are exactly a glossary term (covers the ambiguous everyday words)
  $$("b", root).forEach(b => {
    if (b.closest(SKIP) || b.children.length) return;
    const m = findTerm(b.textContent.trim()); if (!m || used.has(m.t)) return;
    used.add(m.t); b.classList.add("term"); b.tabIndex = 0; b.dataset.def = m.d; b.dataset.name = m.t;
  });
  // first plain-text mention of each unambiguous term
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode: n => n.parentElement.closest(SKIP) || !n.nodeValue.trim() ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT});
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    let n = node, guard = 0;
    while (n && guard++ < 20){
      const re = new RegExp(TERM_RE.source, "ig"); let m, hit = null;
      while ((m = re.exec(n.nodeValue))){ const t = findTerm(m[1]); if (t && !used.has(t.t)){ hit = {m, t}; break; } }
      if (!hit) break;
      used.add(hit.t.t);
      const after = n.splitText(hit.m.index); const rest = after.splitText(hit.m[1].length);
      const el = document.createElement("span"); el.className = "term"; el.tabIndex = 0; el.dataset.def = hit.t.d; el.dataset.name = hit.t.t; el.textContent = after.nodeValue;
      after.replaceWith(el); n = rest;
    }
  });
}
const bubble = document.createElement("div"); bubble.className = "termtip"; bubble.hidden = true; bubble.setAttribute("role", "tooltip"); document.body.appendChild(bubble);
let tipFor = null, hoverAt = 0;
function showTip(el){
  if (el !== tipFor || bubble.hidden) hoverAt = Date.now();
  tipFor = el; bubble.innerHTML = `<b>${el.dataset.name.replace(/\s*\(.*\)/, "")}</b> ${el.dataset.def}`; bubble.hidden = false;
  const r = el.getBoundingClientRect(), w = Math.min(300, window.innerWidth - 20);
  bubble.style.width = w + "px";
  let left = Math.max(10, Math.min(r.left + r.width / 2 - w / 2, window.innerWidth - w - 10));
  bubble.style.left = left + "px";
  const h = bubble.offsetHeight, top = r.top - h - 8 > 64 ? r.top - h - 8 : r.bottom + 8;
  bubble.style.top = top + "px";
}
function hideTip(){ bubble.hidden = true; tipFor = null; }
document.addEventListener("mouseover", e => { const t = e.target.closest(".term"); if (t && t !== tipFor && matchMedia("(hover:hover)").matches) showTip(t); });
document.addEventListener("mouseout", e => { const t = e.target.closest(".term"); if (t && matchMedia("(hover:hover)").matches && !t.contains(e.relatedTarget)) hideTip(); });
document.addEventListener("click", e => { const t = e.target.closest(".term"); if (t){ e.preventDefault(); (t === tipFor && !bubble.hidden && Date.now() - hoverAt > 600) ? hideTip() : showTip(t); } else if (!e.target.closest(".termtip")) hideTip(); });
document.addEventListener("focusin", e => { const t = e.target.closest(".term"); if (t) showTip(t); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
window.addEventListener("scroll", () => { if (!bubble.hidden && tipFor) showTip(tipFor); }, {passive:true});

function route(){
  const [view, sub] = location.hash.replace(/^#/, "").split("/"), app = $("#app");
  const i = CH.findIndex(c => c.id === view);
  if (i >= 0){ app.innerHTML = chapter(i); quiz(i); }
  else if (view === "tools") app.innerHTML = tools();
  else if (view === "formulas") app.innerHTML = formulas();
  else if (view === "glossary"){ app.innerHTML = glossary(); fillGlossary(); }
  else app.innerHTML = home();
  hideTip(); if (i >= 0) addTerms(app);
  $$("[data-w]", app).forEach(el => { try { W[el.dataset.w](el); } catch (e) { el.textContent = "This calculator couldn't load."; console.error(e); } });
  document.title = (i >= 0 ? CH[i].title + " · " : "") + "The Punter's Primer";
  const target = sub && (document.getElementById("s-" + sub) || document.getElementById("t-" + sub));
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  progress();
}
window.addEventListener("hashchange", route);
route();
</script>
