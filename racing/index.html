<style>

@media (prefers-color-scheme: dark){ :root{

td.fx{background:#e3f1e8;color:#111;text-align:center;font-family:var(--mono)} td.tt{background:#eef0f2;color:#111;text-align:center;font-family:var(--mono)}

@media (max-width:560px){ table.bf .lad-outer{display:none} table.bf td.rn{min-width:120px} table.tabc{font-size:12px} table.tabc .who{min-width:0} table.tabc .who b{font-size:12px} table.tabc .who svg.silk{display:none} table.tabc td,table.tabc th{padding:5px 2px} .desk{display:none} .mobonly{display:inline} table.tabc td.pr{font-size:12.5px} table.tabc td.no{width:24px} }

<script>
"use strict";
/* ---------- tiny helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const money = n => (n < 0 ? "−$" : "$") + Math.abs(n).toLocaleString("en-AU", {minimumFractionDigits:2, maximumFractionDigits:2});
const pct = (n, d = 1) => (n * 100).toFixed(d) + "%";
const num = v => { const n = parseFloat(String(v).replace(/[$,%\s]/g, "")); return isFinite(n) ? n : NaN; };
const floor10c = x => Math.floor(x * 10 + 1e-9) / 10;
const MAIN = "https://thomasschmierer.github.io/Dr-Toms-Lexicon/";
const STORE = "punters-primer-v1";
let state = {done:{}};
try { state = Object.assign(state, JSON.parse(localStorage.getItem(STORE) || "{}")); } catch (e) {}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

/* jockey-silk colours for chapter saddle cloths */
const SILKS = ["#c4302b","#1f5a43","#2456a6","#b98a2e","#6b3fa0","#d0611b","#0e7c86","#8a2c55","#4a5a1e","#3b3f8f","#a0522d","#2456a6","#0f6b3c"];

/* ---------- content ---------- */
const CH = [
{
 id:"meeting", part:1, title:"How a race meeting works", blurb:"Classes, weights, barriers, track ratings and reading a form guide.",
 lead:"A horse's chance depends on its ability and the conditions it races under. The form guide records both, and the odds are the market's guess at combining them.",
 body:`
<h2>Betting words to know first</h2>
<p>Racing has its own vocabulary. These words come up from the start. Anywhere in the course, <span class="term-demo">dotted-underlined</span> words show a definition when you hover over them or tap them.</p>
<div class="tbl"><table><tr><th>Word</th><th>Meaning</th></tr>
<tr><td><b>Punter</b></td><td>Anyone who bets.</td></tr>
<tr><td><b>Bookmaker</b> (bookie)</td><td>A business that sets prices and takes bets, such as the TAB's fixed-odds side or Sportsbet.</td></tr>
<tr><td><b>Price</b> / <b>odds</b></td><td>What a winning bet pays per $1. $4.00 means $1 returns $4.</td></tr>
<tr><td><b>Stake</b></td><td>The amount you bet.</td></tr>
<tr><td><b>Return</b></td><td>What you get back from a winning bet, including your stake.</td></tr>
<tr><td><b>Favourite</b> / <b>outsider</b></td><td>The horse with the shortest price / a horse with a long price.</td></tr>
<tr><td><b>Fixed odds</b></td><td>A price locked in when you bet.</td></tr>
<tr><td><b>Tote</b></td><td>A pool: all bets go in, the operator takes a cut, and winners share the rest. The dividend isn't known until the race is run.</td></tr>
<tr><td><b>Dividend</b></td><td>What a tote bet pays per $1.</td></tr>
<tr><td><b>Back</b></td><td>To bet on a horse to win (or place). Every normal bet is a back bet.</td></tr>
<tr><td><b>Lay</b></td><td>To bet that a horse will <i>not</i> win. You act as the bookmaker. Only possible on a betting exchange such as Betfair.</td></tr>
<tr><td><b>Best back</b> / <b>best lay</b></td><td>On an exchange, the best price currently on offer to back (the highest) and to lay (the lowest).</td></tr>
<tr><td><b>Betting exchange</b></td><td>A site where punters bet against each other instead of against a bookmaker.</td></tr>
<tr><td><b>Market</b></td><td>All the prices offered on one race, or one bet type in that race.</td></tr>
<tr><td><b>Field</b></td><td>The horses running in a race.</td></tr>
<tr><td><b>Scratching</b></td><td>A horse withdrawn before the race.</td></tr>
<tr><td><b>The jump</b></td><td>The start of the race. "Near the jump" means just before it starts.</td></tr></table></div>
<p>The full list is in the <a href="#glossary">Glossary</a>.</p>

<h2>The three codes</h2>
<p>Australian racing has three codes: <b>thoroughbreds</b> (the gallops), <b>harness</b> (trotters and pacers pulling a sulky) and <b>greyhounds</b>. Racing Queensland governs all three here. This primer uses thoroughbreds, but the betting maths is identical for every code.</p>

<h2>Meetings and races</h2>
<ul>
<li><b>Meeting:</b> one venue on one day, such as Eagle Farm on a Saturday. Usually 7 to 10 races.</li>
<li><b>Metro, provincial, country:</b> metro meetings (Eagle Farm, Doomben) have the most prize money and the best horses; provincial (Toowoomba, Gold Coast, Sunshine Coast) and country meetings follow.</li>
<li><b>Field:</b> the horses running in a race. Field size decides which bets are offered (Chapter 9).</li>
</ul>

<h2>Race class: the ladder</h2>
<p>Races are graded so horses meet rivals of similar ability. From the bottom up:</p>
<ol>
<li><b>Maiden</b>: horses that have never won.</li>
<li><b>Class 1–6 and Benchmark races</b>: a horse's benchmark rating rises when it wins and falls when it runs poorly. A BM64 race is for horses rated about 64 or below.</li>
<li><b>Listed</b> races.</li>
<li><b>Group 3, Group 2, Group 1</b>: the top level, like the Stradbroke Handicap.</li>
</ol>
<div class="key"><b>Key idea</b>A horse <i>rising</i> in class faces tougher rivals. A horse <i>dropping</i> in class is often a better chance than its recent form looks.</div>

<h2>Weight</h2>
<ul>
<li><b>Handicap:</b> better horses carry more weight, so in theory everyone has an equal chance.</li>
<li><b>Set weights (and penalties):</b> weights fixed by age and sex, with extra for recent wins.</li>
<li><b>Weight-for-age:</b> weight varies only with age, sex and time of year. The best horse usually wins.</li>
<li><b>Apprentice claim:</b> an apprentice jockey takes 1 to 3 kg off the horse's weight, to make up for inexperience.</li>
</ul>
<p>A rough rule of thumb: 1.5 kg is worth about one length over 1,600 m. It's a starting point, not a law.</p>

<h2>Barrier</h2>
<p>The <b>barrier</b> is the starting stall. Inside barriers (1–4) usually mean a shorter trip around the turns; wide barriers can force a horse to race wide or drop back. The effect is biggest in short races on tight tracks.</p>

<h2>Track condition</h2>
<div class="tbl"><table><tr><th>Rating</th><th>Name</th><th>What it means</th></tr>
<tr><td>1–2</td><td>Firm</td><td>Hard and fast</td></tr>
<tr><td>3–4</td><td>Good</td><td>The standard surface</td></tr>
<tr><td>5–7</td><td>Soft</td><td>Some give; suits horses that like a bit of cut</td></tr>
<tr><td>8–10</td><td>Heavy</td><td>Very wet; dry-track form often counts for little</td></tr></table></div>

<h2>Reading a form line</h2>
<p>A form string lists recent finishing positions, oldest on the left and newest on the right. <b>x</b> marks a spell (a break of three months or more) and <b>0</b> means 10th or worse. Type one in below to decode it.</p>
<div data-w="form"></div>
<p>Alongside the form line, a guide shows the horse's record at the track, at the distance and on each track condition, days since its last run, trainer and jockey, its last start (margin, weight, barrier, class) and a <b>speed map</b> predicting where it will settle in the run. Chapters 2 to 5 unpack all of these.</p>
<div class="key"><b>For your model</b>Every one of these is a feature. Chapter 11 comes back to them.</div>`,
 quiz:[
  {q:"In the form line x2316, what does the x mean?", o:["The horse fell","A spell of three months or more","It was scratched","It ran 10th or worse"], a:1, why:"x marks a spell. A 0 is what marks 10th or worse."},
  {q:"Which race is the highest class?", o:["BM78","Listed","Group 1","Maiden"], a:2, why:"Group 1 is the top of the ladder, above Group 2, Group 3 and Listed."},
  {q:"A track is rated 9. What is it?", o:["Good","Soft","Firm","Heavy"], a:3, why:"8 to 10 is Heavy."},
  {q:"In a handicap, the best horses carry…", o:["less weight","more weight","the same weight","no weight"], a:1, why:"Handicaps give better horses more weight to even up their chances."}
 ]
},
{
 id:"horse", part:1, title:"The racehorse", blurb:"Breeding, age, sex, sprinters versus stayers, and what a horse's name tells you.",
 lead:"Every thoroughbred's ability starts with its breeding and is shaped by its age, sex and build. Those decide which races it can run in, how much weight it carries, and how far it wants to go.",
 body:`
<h2>Breeding: sire, dam and damsire</h2>
<ul>
<li><b>Sire:</b> the father. Stallions stand at stud and can have hundreds of foals a year, so a sire's record is a big, useful sample: the share of his runners that win, and at what distances and on what tracks.</li>
<li><b>Dam:</b> the mother. A mare has one foal a year at most, so her record is a small sample.</li>
<li><b>Damsire:</b> the mother's father. Form guides often show "by <i>Sire</i> out of <i>Dam</i> (<i>Damsire</i>)".</li>
</ul>
<p>Breeding matters most when a horse has little form of its own: a first-starter, a horse trying a new distance, or one meeting a wet track for the first time. Once a horse has a real race record, its own form usually tells you more.</p>
<div class="key"><b>Key idea</b>Breeding is a prior; form is the evidence. The less a horse has raced, the more weight its pedigree deserves.</div>

<h2>Every horse has the same birthday</h2>
<p>In Australia every thoroughbred turns a year older on <b>1 August</b>, whatever its real foaling date. Breeders time matings so foals arrive soon after that date, because a foal born in December races against horses up to four months older but carries the same age.</p>
<div data-w="age"></div>
<ul>
<li><b>Two-year-olds:</b> the youngest racers, still growing. Big early-maturing types often do best.</li>
<li><b>Three-year-olds:</b> the year of the classic races (Derbies, Guineas, Oaks), often restricted to their own age.</li>
<li><b>Four to six:</b> usually the peak years for most horses.</li>
<li><b>Seven and older:</b> many decline, though geldings can race on for years.</li>
</ul>

<h2>Sex</h2>
<div class="tbl"><table><tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Colt</td><td>Entire (not castrated) male aged 4 or under</td></tr>
<tr><td>Horse</td><td>Entire male aged 5 or over</td></tr>
<tr><td>Gelding</td><td>Castrated male</td></tr>
<tr><td>Rig</td><td>A male with a retained testicle</td></tr>
<tr><td>Filly</td><td>Female aged 4 or under</td></tr>
<tr><td>Mare</td><td>Female aged 5 or over</td></tr></table></div>
<p>Fillies and mares usually get a weight allowance when they race against males, so they carry less. Watch for "gelded" in the gear changes: a colt that was hard to handle sometimes improves once it's gelded.</p>

<h2>Sprinters, milers and stayers</h2>
<div class="tbl"><table><tr><th>Type</th><th>Typical distances</th><th>Build and style</th></tr>
<tr><td>Sprinter</td><td>1000–1400 m</td><td>Heavily muscled, quick to reach top speed</td></tr>
<tr><td>Miler</td><td>1500–1700 m</td><td>Speed that lasts a little longer</td></tr>
<tr><td>Middle distance</td><td>1800–2200 m</td><td>Balance of speed and stamina</td></tr>
<tr><td>Stayer</td><td>2400 m and up</td><td>Leaner, more economical, sustains a long run</td></tr></table></div>
<p>Most horses have a best distance range. A sprinter stretched to 2000 m usually fades late; a stayer dropped to 1000 m usually can't keep up early. Horses often step up in distance as they mature through a preparation (Chapter 3).</p>

<h2>What's in a name</h2>
<ul>
<li><b>(NZ), (GB), (IRE), (USA), (JPN)</b> after a name: bred overseas. No suffix means bred in Australia.</li>
<li>Names are registered and unique in Australia, which makes the name plus foaling year a good key for your database.</li>
</ul>`,
 quiz:[
  {q:"A horse was foaled on 20 September 2023. What is its official racing age on 1 September 2026?", o:["2","3","4","It depends on the race"], a:1, why:"It turns 1 on 1 August 2024, 2 on 1 August 2025 and 3 on 1 August 2026."},
  {q:"What is a gelding?", o:["A young female","A castrated male","A male with a retained testicle","A horse bred in New Zealand"], a:1, why:"A gelding is a castrated male. A rig has a retained testicle."},
  {q:"What does (NZ) after a horse's name mean?", o:["It races in New Zealand","It was bred in New Zealand","Its jockey is from New Zealand","It's a novice"], a:1, why:"The suffix shows the country where the horse was bred."},
  {q:"When does pedigree matter most?", o:["For a horse with 30 starts","For a first-starter or a horse trying something new","Never","Only in Group 1 races"], a:1, why:"With little form to go on, breeding is the best evidence available."}
 ]
},
{
 id:"training", part:1, title:"Training and the preparation", blurb:"Spells, trials, first-up and second-up form, trainer patterns and gear changes.",
 lead:"A racehorse runs in cycles called preparations: a spell, a build-up, a run of races, then another spell. Where a horse sits in that cycle is one of the strongest clues to how it will run.",
 body:`
<h2>The trainer's job</h2>
<p>The trainer decides when a horse races, how far, in what class, and in what gear. Their stable staff, strappers and trackwork riders handle the daily work. Big stables have hundreds of horses across several locations; small country trainers may have a handful. Trainers develop patterns you can measure, such as how well their horses run first-up or how often their well-backed runners win.</p>

<h2>The preparation cycle</h2>
<ol>
<li><b>Spell:</b> weeks or months in the paddock, resting. Shown as <b>x</b> in a form line.</li>
<li><b>Pre-training:</b> slow work to rebuild fitness, often at a separate property.</li>
<li><b>Trackwork:</b> regular gallops at the track, building speed and stamina.</li>
<li><b>Jump-outs and barrier trials:</b> practice races from the barriers. Trials are official and timed; jump-outs are less formal.</li>
<li><b>First-up:</b> the first race back from a spell. Then <b>second-up</b>, <b>third-up</b> and so on.</li>
<li><b>Back to the spell</b> when the horse is tired, sore or has done its job.</li>
</ol>
<div class="key"><b>Key idea</b>Many horses need a run or two to reach peak fitness, so they improve second- and third-up. Others race best fresh. Late in a long preparation, many horses go flat. A horse's own first-up and second-up record tells you which type it is.</div>

<h2>Reading a record: 8:3-2-1</h2>
<p>Australian form guides write records as <b>starts:wins-seconds-thirds</b>. "First-up 8:3-2-1" means 8 first-up runs for 3 wins, 2 seconds and 1 third. The same notation is used for the horse's record at the track, at the distance and on each track condition.</p>
<div data-w="record"></div>
<div class="key"><b>Small samples</b>A 2:2-0-0 record looks perfect but tells you very little. The range shown above (a 95% Wilson interval, the same idea as a confidence interval for a proportion) shows how wide the uncertainty really is.</div>

<h2>Trials and the rules</h2>
<ul>
<li>In Queensland, since 1 August 2025, an unraced horse must complete an official trial to the stewards' satisfaction before it can start at any TAB meeting (<a href="https://www.racingqueensland.com.au/news/2025/06-june/local-rule-amendment-barrier-certificates-and-post-meeting-trials" target="_blank" rel="noopener">Racing Queensland</a>).</li>
<li>Nationally, a horse that hasn't raced for 12 months or more needs a satisfactory veterinary clearance and must trial satisfactorily before it can be nominated for a race (<a href="https://t.racingaustralia.horse/uploadimg/Australian_rules_of_Racing/Calendar-Notices/2026/Calendar-Notice-AR-88B-and-Codes-of-Practice.pdf" target="_blank" rel="noopener">Racing Australia</a>).</li>
</ul>
<p>Trial results are public. A horse that trialled well, or finished fast without being pushed, is often better than its first-up price suggests.</p>

<h2>Gear changes</h2>
<p>Trainers fit gear to fix a problem, and every change must be declared. Form guides list them as <b>first time</b>, <b>again</b> (refitted after a break) or <b>off</b>.</p>
<div class="tbl"><table><tr><th>Gear</th><th>What it's for</th></tr>
<tr><td>Blinkers</td><td>Cups that block side and rear vision, to help a horse concentrate</td></tr>
<tr><td>Winkers</td><td>Sheepskin strips on the cheeks; a milder version of blinkers</td></tr>
<tr><td>Visors</td><td>Blinkers with a slit, so the horse can see a little to the side</td></tr>
<tr><td>Tongue tie</td><td>Stops the tongue sliding back and affecting breathing</td></tr>
<tr><td>Lugging bit</td><td>Helps the jockey stop a horse that pulls (lugs) in or out</td></tr>
<tr><td>Ear muffs</td><td>Muffle crowd noise for a nervous horse</td></tr>
<tr><td>Nose roll / cross-over noseband</td><td>Help keep the head down and the mouth closed</td></tr></table></div>
<p>"Blinkers first time" is the change punters watch most. It can sharpen a horse that has been racing lazily, but it doesn't always work, so treat it as a question to test in your data, not a rule.</p>

<h2>Days between runs</h2>
<p>Most horses in a preparation race every two to four weeks. A quick back-up (under 10 days) or a long gap mid-preparation can be a sign the trainer is placing the horse cleverly, or that something went wrong. Days since last run is one of the easiest features to compute and one of the most used.</p>`,
 quiz:[
  {q:"What does \"first-up\" mean?", o:["The horse's first ever race","The first race back after a spell","Leading in the first 200 m","Barrier 1"], a:1, why:"First-up is the first run of a new preparation, after a spell."},
  {q:"A horse's record is 10:2-3-1. What is its top-three (place) strike rate?", o:["20%","30%","60%","10%"], a:2, why:"2 + 3 + 1 = 6 top-three finishes from 10 starts, so 60%."},
  {q:"What are blinkers meant to do?", o:["Protect the eyes from sand","Narrow the horse's vision so it concentrates","Help breathing","Stop it pulling"], a:1, why:"Blinkers block side and rear vision to help a horse focus."},
  {q:"In Queensland, what must an unraced horse do before starting at a TAB meeting?", o:["Nothing","Win a jump-out","Complete an official trial to the stewards' satisfaction","Race at a country meeting first"], a:2, why:"Since 1 August 2025, Queensland requires an official trial first."}
 ]
},
{
 id:"pace", part:1, title:"Jockeys, pace and the track", blurb:"Jockey claims, speed maps, race shape, sectional times and track bias.",
 lead:"A race isn't just a test of ability. Where a horse settles, how fast the early pace is, and which part of the track is fastest can swing the result by lengths.",
 body:`
<h2>Jockeys</h2>
<ul>
<li><b>Riding weight:</b> jockeys must make the horse's allotted weight, including the saddle, so the lightest jockeys get the most rides in handicaps.</li>
<li><b>Apprentice claims:</b> apprentices take 1 to 3 kg off, depending on how many winners they've ridden. A good apprentice on a top-weight can be a real advantage.</li>
<li><b>Jockey changes:</b> a leading jockey picking up a ride (a "jockey upgrade") is often a sign the stable expects it to run well, and the market usually reacts.</li>
</ul>

<h2>Race shape and the speed map</h2>
<p>A <b>speed map</b> predicts where each horse will settle: <b>leader</b>, <b>on-pace</b> (just behind the leader), <b>midfield</b> or <b>backmarker</b>. That matters because the pace of a race affects runners differently.</p>
<div class="tbl"><table><tr><th>Pace</th><th>What happens</th><th>Who it suits</th></tr>
<tr><td>Slow early</td><td>Leaders save energy and still sprint home</td><td>Leaders and on-pace runners</td></tr>
<tr><td>Genuine</td><td>A fair test</td><td>The best horse, wherever it settles</td></tr>
<tr><td>Fast early</td><td>Leaders tire late</td><td>Backmarkers with a strong finish</td></tr></table></div>
<p>A race with several natural leaders often turns into a fast early battle that sets it up for the closers. A race with one leader often lets that horse dictate a soft pace. Reading the speed map is reading likely race shape.</p>
<div class="key"><b>Key idea</b>A horse that ran on strongly from the back in a slowly run race may have been better than its finishing position. A horse that led in a slowly run race may have been flattered.</div>

<h2>Times, sectionals and margins</h2>
<p>Race times are measured to hundredths of a second. <b>Sectional times</b> split the race into parts, most often the last 600 m and the last 200 m. Margins are in <b>lengths</b> (a horse's length, roughly 2.4 m), and shorter margins have names: a nose, a short head, a head, a neck.</p>
<div data-w="speed"></div>
<p class="note">Raw times aren't comparable across tracks or days: a heavy track can be several seconds slower than a good one. Time-based ratings adjust for track and conditions before comparing.</p>

<h2>Track direction and bias</h2>
<ul>
<li><b>Direction:</b> Brisbane and Melbourne race anticlockwise; Sydney races clockwise. Some horses clearly prefer one way.</li>
<li><b>Rail position:</b> the running rail is moved out to protect worn turf. Reports say "rail out 3 m" or "rail true".</li>
<li><b>Track bias:</b> on some days the inside lanes are fastest; on others, after rain, horses wide out on the fresher ground do better. Watching the early races for a pattern is a long-standing punting habit.</li>
<li><b>Track shape:</b> tight, turning tracks favour on-pace horses and inside barriers. Big tracks with long straights give backmarkers more time to catch up.</li>
</ul>`,
 quiz:[
  {q:"A horse runs 1200 m in 70.00 seconds. Roughly what was its average speed?", o:["17 km/h","43 km/h","62 km/h","85 km/h"], a:2, why:"1200 ÷ 70 = 17.1 m/s, and × 3.6 ≈ 61.7 km/h."},
  {q:"A backmarker with a strong finish is best suited by…", o:["A slow early pace","A fast early pace","A wet track only","Barrier 1"], a:1, why:"A fast early pace tires the leaders, which sets the race up for closers."},
  {q:"About how far is a two-length margin?", o:["0.5 m","2 m","5 m","20 m"], a:2, why:"A length is about 2.4 m, so two lengths is close to 5 m."},
  {q:"Which way do Brisbane tracks race?", o:["Clockwise","Anticlockwise","Straight only","It changes each meeting"], a:1, why:"Brisbane (like Melbourne) races anticlockwise; Sydney races clockwise."}
 ]
},
{
 id:"raceday", part:1, title:"Race day, stewards and welfare", blurb:"Acceptances, scratchings, stewards' reports, vet checks and the bleeding rules.",
 lead:"The form guide is written days before a race. Race day adds new information: scratchings, track changes, behaviour in the parade, and afterwards the stewards' report on what actually happened in the run.",
 body:`
<h2>From nomination to the jump</h2>
<ol>
<li><b>Nominations:</b> trainers enter horses for races, often several days ahead.</li>
<li><b>Weights and acceptances:</b> handicaps are set and trainers confirm their runners. The field and barriers are drawn.</li>
<li><b>Scratchings:</b> horses withdrawn after acceptances. A <b>late scratching</b> on race day can trigger fixed-odds deductions (Chapter 9).</li>
<li><b>Mounting yard and parade:</b> horses are walked before the race. Experienced watchers look for condition and calm behaviour, and notice excessive sweating or agitation.</li>
<li><b>The race</b>, then <b>correct weight</b> once jockeys weigh in and any protest is settled. Bets are paid after that.</li>
</ol>

<h2>Stewards' reports: hidden form</h2>
<p>Stewards are the racing officials who police each meeting. After every meeting they publish a report noting anything that affected a runner. These notes are some of the most valuable free data in racing, because they explain results that the finishing position hides.</p>
<div class="tbl"><table><tr><th>Typical note</th><th>What it suggests</th></tr>
<tr><td>Slow to begin / missed the start</td><td>Lost ground at the start; may be better than its finish</td></tr>
<tr><td>Held up / checked / no clear run in the straight</td><td>Couldn't show its full ability</td></tr>
<tr><td>Raced wide without cover</td><td>Covered extra ground and used more energy</td></tr>
<tr><td>Over-raced / pulled hard</td><td>Wasted energy fighting the jockey; gear may change next time</td></tr>
<tr><td>Lame / bled / irregular heart rhythm</td><td>A genuine excuse, and often a forced break</td></tr>
<tr><td>Jockey questioned about the ride</td><td>The stewards weren't satisfied with the tactics</td></tr></table></div>
<div class="key"><b>For your model</b>Turning these notes into flags (such as "checked in run" or "raced wide") gives your model information the finishing positions don't contain, and that the market may underweight.</div>

<h2>Vet checks and bleeding</h2>
<p>Horses can be examined by a vet before and after a race. One common finding is <b>bleeding</b>: blood from the nostrils caused by bleeding in the lungs during hard exercise. Australian rules are strict:</p>
<ul>
<li>After a first bleeding attack, a horse can't be ridden in any exercise for two months (<a href="https://tasracingcorporate.com.au/wp-content/uploads/2023/12/Calendar-Notice-AR-79-1.2.24.pdf" target="_blank" rel="noopener">AR 79</a>). It must also serve a three-month ban from racing and pass the stewards' conditions before it returns.</li>
<li>A second bleeding attack generally means a lifetime ban from racing in Australia.</li>
</ul>
<p>A horse returning from a bleeding ban, a long injury or a "not fully tested" run carries more uncertainty than its form suggests.</p>

<h2>Welfare and integrity</h2>
<p>Australian racing has rules on drug testing, whip use, retirement reporting and fitness to race. Horses can be swabbed before or after racing, and trainers are responsible for anything found. For a model, integrity rules mostly show up as data quirks: horses scratched by stewards, runs voided, or long, unexplained breaks.</p>`,
 quiz:[
  {q:"A stewards' report says a horse was \"held up for a run in the straight\". What does that suggest?", o:["It's injured","It may be better than its finishing position","It should be banned","It won easily"], a:1, why:"It couldn't use its finish, so its result probably understates its ability."},
  {q:"What happens after a horse's first bleeding attack in Australia?", o:["Nothing","A lifetime ban","No riding for two months and a three-month ban from racing","A fine for the trainer"], a:2, why:"The first attack brings an exercise ban and a racing ban; a second usually means a lifetime ban."},
  {q:"When are bets paid?", o:["When the horses cross the line","After correct weight is declared","The next day","After the stewards' report is published"], a:1, why:"Correct weight confirms the result, after jockeys weigh in and any protest is settled."}
 ]
},
{
 id:"odds", part:2, title:"Odds are probabilities", blurb:"Turning any price into a chance of winning, and back again.",
 lead:"A price of $4.00 means the market rates the horse about a 25% chance. Everything else in this primer builds on that one conversion.",
 body:`
<h2>Decimal odds</h2>
<p>Australian prices are <b>decimal odds</b>: the total you get back for each $1, <b>including your stake</b>. A $10 bet at $4.00 returns $40, which is your $10 back plus $30 profit.</p>
<div class="formula">Return = Stake × Odds<br>Profit = Stake × (Odds − 1)</div>

<h2>Implied probability</h2>
<p>The <b>implied probability</b> is the chance at which a bet breaks even. It's 1 divided by the odds. Flip it around and you get the <b>fair price</b> for any probability.</p>
<div class="formula">Implied probability = 1 ÷ Odds<br>Fair odds = 1 ÷ Probability</div>
<div class="ex"><b class="t">Why it works</b>If a horse truly wins 25% of the time and you bet $1 at $4.00 a hundred times, you stake $100. You win 25 times and collect 25 × $4 = $100. You break even, so $4.00 is the fair price of a 25% chance.</div>
<div data-w="odds"></div>

<h2>Other formats you'll meet</h2>
<ul>
<li><b>Fractional (UK):</b> 5/1 means $5 profit per $1. Decimal = fraction + 1, so 5/1 = $6.00.</li>
<li><b>American:</b> +500 means $500 profit on $100 ($6.00); −200 means stake $200 to win $100 ($1.50).</li>
<li><b>Odds-on / odds-against:</b> under $2.00 is odds-on (more likely to win than lose); over $2.00 is odds-against.</li>
<li><b>Short / long:</b> a short price is a low number (strong chance); a long price is an outsider, or "roughie".</li>
</ul>

<div class="key"><b>Key idea</b>Probability isn't certainty. A $1.50 favourite still loses about one race in three; a $21 outsider still wins about one in twenty. Odds describe what happens over many races, never the next one.</div>`,
 quiz:[
  {q:"What is the implied probability of a $5.00 price?", o:["5%","20%","25%","50%"], a:1, why:"1 ÷ 5 = 0.20, so 20%."},
  {q:"You bet $20 at $3.50. If it wins, what do you get back in total?", o:["$50","$70","$73.50","$90"], a:1, why:"Return = 20 × 3.50 = $70, which includes your $20 stake."},
  {q:"What is the fair price for a horse with a 40% chance?", o:["$1.40","$2.00","$2.50","$4.00"], a:2, why:"1 ÷ 0.40 = 2.50."},
  {q:"UK odds of 4/1 are what in decimal?", o:["$4.00","$5.00","$1.25","$0.25"], a:1, why:"Fraction + 1: 4 + 1 = $5.00."}
 ]
},
{
 id:"setting", part:2, title:"How odds are set", blurb:"Tote pools, bookmakers, the overround and why prices move.",
 lead:"In a tote the bettors set the price and the operator takes a cut. With fixed odds a bookmaker sets the price with a margin built in. Either way, the probabilities add up to more than 100%.",
 body:`
<h2>System 1: the tote (a pool)</h2>
<p>Every win bet on a race goes into one pot. The operator (in Queensland, the TAB) takes its commission, called the <b>takeout</b>, and the rest is shared among the winning tickets. Nobody knows the final dividend until betting closes.</p>
<ol><li>Add up all win bets: the <b>gross pool</b>.</li><li>Take out the commission: the <b>net pool</b>.</li><li>Divide by the total bet on the winner.</li><li>Round down (usually to 10 cents). That rounding is called <b>breakage</b>.</li></ol>
<div class="formula">Win dividend = Gross pool × (1 − takeout) ÷ Total bet on the winner</div>
<div class="ex"><b class="t">Worked example</b>A $100,000 win pool at 14.5% takeout leaves $85,500. Bettors put $25,000 on horse A. If A wins, each $1 is worth $85,500 ÷ $25,000 = $3.42, paid as <b>$3.40</b>. The crowd rated A 25% (a fair $4.00); the gap is the commission.</div>
<div data-w="tote"></div>
<p><b>Takeout rates.</b> Queensland last set tote commission in regulation in 2012: about 14.5% win, 14.25% place, 14.75% quinella, 21% trifecta, 22.5% First Four and 20% quadrella. The operator has set its own rates since 2013, so check the TAB's current figures. Since 3 October 2026 the TAB's tote has been <b>One Pool</b>, a single national pool merging NSW TAB, SuperTAB and UniTAB, with a 14.5% win takeout (Chapter 13). The pattern holds: <b>exotics carry a bigger cut than win and place.</b></p>

<h2>System 2: fixed odds (bookmakers)</h2>
<p>A bookmaker quotes a price, and the price you take is locked in, whatever the market does afterwards (late scratchings aside; see Chapter 9). The bookmaker estimates each horse's chance, scales the chances up so they total more than 100%, then adjusts as money comes in.</p>

<h2>The overround</h2>
<p>Add up the implied probabilities of every runner. The amount over 100% is the <b>overround</b>, the bookmaker's built-in margin. Edit the prices below and watch it change.</p>
<div data-w="market"></div>
<div class="formula">Overround = Σ (1 ÷ odds) − 1</div>
<ul>
<li>Big-race win markets: often around 105–115%.</li>
<li>Small country races and thin markets: often 115–130% or more.</li>
<li>Place and exotic markets: bigger again.</li>
<li>A tote win pool at 14.5% takeout: 1 ÷ 0.855 ≈ <b>117%</b>.</li>
</ul>

<h2>Why prices move</h2>
<ul>
<li><b>Firming:</b> the price shortens ($6.00 → $4.00). Money or information is coming for the horse.</li>
<li><b>Drifting:</b> the price lengthens. Money is going elsewhere, or there's a negative sign.</li>
<li><b>Flucs:</b> the record of these moves, from opening price to starting price.</li>
</ul>
<div class="key"><b>Key idea</b>Late prices are usually more accurate than early ones, because information keeps arriving until the jump. Beating the final price consistently is hard. Chapter 8 follows a market from open to jump.</div>

<h2>Betting exchanges</h2>
<p>On an exchange such as Betfair, punters bet against each other. You can <b>back</b> a horse to win or <b>lay</b> it (bet that it loses, acting as the bookie). The exchange charges commission on net winnings instead of building a margin into the price, so exchange prices near the jump are the closest thing to a margin-free market.</p>`,
 quiz:[
  {q:"A $50,000 win pool has 15% takeout and $17,000 bet on the winner. What's the dividend (before breakage)?", o:["$2.50","$2.94","$3.40","$2.13"], a:0, why:"50,000 × 0.85 = 42,500. 42,500 ÷ 17,000 = $2.50."},
  {q:"A market's implied probabilities add up to 112%. What's the overround?", o:["112%","88%","12%","1.12%"], a:2, why:"The excess over 100% is the overround: 12%."},
  {q:"On the tote, who sets the price?", o:["The TAB's traders","The stewards","The bettors, through how much they put on each horse","The trainer"], a:2, why:"The dividend is the net pool shared out by how the money was bet."},
  {q:"Why are prices at the jump usually more accurate than opening prices?", o:["Bookmakers are tired","More information and money have come in","The takeout drops","They aren't"], a:1, why:"Markets absorb news and informed money right up to the start."}
 ]
},
{
 id:"market", part:2, title:"The market's life cycle", blurb:"How prices move from open to jump, closing line value, and testing whether early prices are wrong.",
 lead:"A fixed-odds price is a forecast that gets updated until the race jumps. If you can predict which way it will be updated, you're finding prices the market itself later agrees were wrong.",
 body:`
<h2>The timeline of a market</h2>
<div class="tbl"><table><tr><th>Stage</th><th>What's happening</th><th>What it means for prices</th></tr>
<tr><td><b>Open</b> (often days before, once fields and barriers are known)</td><td>Bookmakers frame prices from ratings and form. Little money has been bet.</td><td>Least accurate. Margins are often wider and bet limits lower.</td></tr>
<tr><td><b>Middle</b> (the days in between)</td><td>Jockey bookings, gear changes, trial results and early money arrive.</td><td>Prices start to absorb public information.</td></tr>
<tr><td><b>Race morning</b></td><td>Scratchings, track rating, rail position, weather. Prices are recalculated for the final field.</td><td>Large moves are common; deductions apply to earlier bets.</td></tr>
<tr><td><b>Last hour to the jump</b></td><td>Most money arrives, including from professional bettors. Tote pools build.</td><td>Most accurate. Margins narrow and bet limits rise.</td></tr></table></div>
<p>So the market gets more accurate over time. That means the <b>final price is the best available estimate of a horse's chance</b>, and the gap between an early price and the final price is a measure of how wrong the early price was.</p>

<h2>Firming, drifting and the market total</h2>
<p>A horse's price can move for two different reasons:</p>
<ol>
<li><b>Its chance changed</b>, in the market's view: money or news for or against it.</li>
<li><b>The whole market changed:</b> the bookmaker trimmed its margin as the jump approached, or a scratching removed a runner.</li>
</ol>
<p>Only the first is information. To separate them, compare the horse's <b>margin-free</b> probability at each time (Chapter 7), not the raw price. A horse that goes from $5.00 in a 120% market to $4.60 in a 108% market has firmed more than its price suggests. The raw price shortened only 40 cents, but its margin-free chance rose from 16.7% to 20.1%, because the bookmaker was cutting its margin at the same time. The reverse also happens: a horse whose price holds steady while the margin shrinks has actually firmed.</p>
<div data-w="path"></div>
<div class="key"><b>Key idea</b>A "plunge" (a big, fast firm) usually reflects money from people who know something, or think they do. Plunges often turn out to be right, but not always, and by the time you see one the value has usually gone.</div>

<h2>Closing line value (CLV)</h2>
<p><b>Closing line value</b> compares the price you took with the final price. If you take $5.00 and the horse starts at $4.00, you beat the close.</p>
<div class="formula">Raw CLV = Price taken ÷ Final price − 1<br>Edge vs close = p<sub>close</sub> × Price taken − 1</div>
<p>Here p<sub>close</sub> is the margin-free probability at the jump. The second line asks: if the closing market was right, what was your bet worth on average?</p>
<div data-w="clv"></div>
<div class="key"><b>Why CLV matters</b>Profit takes thousands of bets to separate skill from luck (Chapter 10). CLV settles much faster, because every bet gives you a measurement, win or lose. Bettors who consistently beat the closing price tend to be the ones who profit in the long run.</div>

<h2>Testing your opportunity</h2>
<p>Your idea is that opening prices contain discrepancies that the market later corrects. That's testable with your timestamped prices:</p>
<ol>
<li>For each runner, record its margin-free probability at the open and at the close.</li>
<li>The <b>move</b> is the close minus the open. That's what you're trying to predict.</li>
<li>Using only information available at the open, can your model predict the direction of the move better than chance?</li>
<li>Simulate betting at the open whenever your model's probability is above the opening price's. Measure the average CLV of those bets, then the profit.</li>
<li>Check it holds across tracks, classes and price bands, not just among long shots (the favourite–longshot bias again).</li>
</ol>
<div data-w="clvlog"></div>

<h2>Practical catches</h2>
<ul>
<li><b>Limits.</b> Early markets usually accept smaller bets, so an edge at the open may only be usable in small amounts.</li>
<li><b>Restrictions.</b> Bookmakers watch for accounts that keep beating the closing price and often cut their limits. A real edge here is hard to use at scale with fixed-odds bookmakers.</li>
<li><b>Deductions.</b> An early fixed-odds bet can be cut by deductions if a well-fancied horse is scratched later (Chapter 9).</li>
<li><b>Tote is different.</b> On the tote you can't lock in an early price; your dividend is set at the jump. Some bookmakers offer products that pay the better of the tote or the top fluctuation, which changes the timing maths again.</li>
<li><b>Data timing.</b> If your "opening price" was actually scraped hours after the open, your test overstates the edge available. Record exactly when every price was captured.</li>
</ul>`,
 quiz:[
  {q:"When is a fixed-odds market usually most accurate?", o:["At the open","The day before","Close to the jump","After the race"], a:2, why:"Most information and money arrives late, so prices near the jump are the best estimates."},
  {q:"You took $6.00 and the horse started at $4.50. What's your raw CLV?", o:["+33%","−25%","+1.50","+25%"], a:0, why:"6.00 ÷ 4.50 − 1 = 0.333, so +33%."},
  {q:"A horse stays at $5.00 while the market total falls from 120% to 110%. What happened to its margin-free chance?", o:["It fell","It stayed the same","It rose","You can't tell"], a:2, why:"20% ÷ 1.20 = 16.7% before; 20% ÷ 1.10 = 18.2% after. Holding its price while the margin shrinks means the market rates it more likely."},
  {q:"Why is CLV useful for testing a strategy?", o:["It guarantees profit","It gives a measurement on every bet, so it settles much faster than profit","It removes the takeout","Bookmakers publish it"], a:1, why:"Profit needs thousands of bets to beat luck; CLV measures each bet against the market's best estimate."}
 ]
},
{
 id:"payouts", part:2, title:"How payouts are calculated", blurb:"Win, place, each way, exotics, flexi, multis, dead heats and deductions.",
 lead:"Every payout is either stake × price (fixed odds) or a share of a pool (tote). Bet types differ only in which finishing orders count and how many combinations you buy.",
 body:`
<div class="toc"><a href="#payouts/win">Win &amp; place</a><a href="#payouts/ew">Each way</a><a href="#payouts/exotic">Exotics &amp; flexi</a><a href="#payouts/harville">Harville</a><a href="#payouts/multi">Multis</a><a href="#payouts/dh">Dead heats</a><a href="#payouts/ded">Deductions</a></div>
<p>Bets are paid once stewards declare <b>correct weight</b>, after any protest is settled.</p>

<h2 id="s-win">Win</h2>
<p>Pick the winner. Fixed odds: $10 at $5.00 returns $50. Tote: dividends are quoted per $1, so $10 on a $4.80 dividend returns $48.</p>

<h2>Place</h2>
<p>Pick a horse to finish in the places. Field size sets how many places the TAB pays:</p>
<div class="tbl"><table><tr><th>Starters</th><th>Places paid</th></tr><tr><td>8 or more</td><td>1st, 2nd, 3rd</td></tr><tr><td>5 to 7</td><td>1st, 2nd</td></tr><tr><td>4 or fewer</td><td>Usually no place betting</td></tr></table></div>
<p><b>How a tote place dividend works:</b> take out the commission, hand every winning ticket its stake back, split the rest into equal shares (one per placegetter), then divide each share by the money on that horse.</p>
<div data-w="place"></div>
<div class="key"><b>Key idea</b>A place dividend depends on which <i>other</i> horses fill the places. A favourite placing with two outsiders pays more than a favourite placing with two other favourites.</div>

<h2 id="s-ew">Each way</h2>
<p>Two equal bets: one to win, one to place. "$10 each way" costs <b>$20</b>. If the horse wins you collect both; if it places you collect only the place part.</p>
<div data-w="ew"></div>

<h2 id="s-exotic">Exotics and flexi</h2>
<div class="tbl"><table><tr><th>Bet</th><th>Pick</th><th>Combinations to box k horses</th></tr>
<tr><td>Quinella</td><td>1st &amp; 2nd, any order</td><td>k(k−1)/2</td></tr>
<tr><td>Exacta</td><td>1st &amp; 2nd, exact order</td><td>k(k−1)</td></tr>
<tr><td>Trifecta</td><td>1st, 2nd, 3rd in order</td><td>k(k−1)(k−2)</td></tr>
<tr><td>First Four</td><td>1st to 4th in order</td><td>k(k−1)(k−2)(k−3)</td></tr>
<tr><td>Duet</td><td>Any two of the three placegetters</td><td>k(k−1)/2</td></tr></table></div>
<p><b>Boxing</b> covers every order of your horses. A <b>standout</b> fixes one horse in a position and boxes the rest. With <b>flexi</b> betting you choose your total outlay and get that percentage of the $1 dividend.</p>
<div class="formula">Flexi % = Outlay ÷ Combinations</div>
<div data-w="exotic"></div>

<h2 id="s-harville">How likely is an exotic? The Harville formula</h2>
<p>Once one horse has won, assume the rest share second place in proportion to their win chances. That gives the chance of any finishing order.</p>
<div class="formula">P(i then j) = pᵢ × pⱼ ÷ (1 − pᵢ)<br>P(i, j, k) = pᵢ × pⱼ ÷ (1 − pᵢ) × pₖ ÷ (1 − pᵢ − pⱼ)</div>
<div data-w="harville"></div>
<p class="note">Harville tends to rate favourites too highly for the minor placings. Better models adjust it, but it's the standard starting point.</p>

<h2 id="s-multi">Multis, doubles and quaddies</h2>
<p>In a <b>multi</b> (all-up) every leg must win, and the prices multiply. A <b>quaddie</b> needs the winners of four nominated races; combinations = the product of the horses in each leg (2 × 3 × 2 × 4 = 48). The bookmaker's margin multiplies too.</p>
<div data-w="multi"></div>

<h2 id="s-dh">Dead heats</h2>
<p>When horses tie for a paying place they share it. With fixed odds your stake is divided by the number of horses in the dead heat: $10 at $5.00 in a two-way dead heat counts as $5 at $5.00, returning <b>$25</b>. On the tote, the net pool is split between them.</p>

<h2 id="s-ded">Scratchings and deductions</h2>
<ul><li><b>Tote:</b> a bet on a scratched horse is refunded.</li>
<li><b>Fixed odds, on the scratched horse:</b> refunded.</li>
<li><b>Fixed odds, on another horse:</b> your winnings may be cut by a <b>deduction</b>.</li></ul>
<p>The field just lost a runner with a real chance, so every other horse is now more likely to win and the price you took is too generous. The shorter the scratched horse's price, the bigger the deduction. It comes off your <b>winnings only</b>, never your stake, and each operator publishes its own table.</p>
<div class="formula">Return = Stake + Winnings × (1 − deduction per $1)</div>
<div data-w="deduct"></div>`,
 quiz:[
  {q:"$10 each way at $8.00 win and $2.50 place. The horse runs 3rd. What's your profit?", o:["−$20","+$5","+$15","+$25"], a:1, why:"Only the place half pays: $10 × 2.50 = $25 back on a $20 outlay, so +$5."},
  {q:"How many combinations is a 4-horse exacta box?", o:["4","6","12","24"], a:2, why:"k(k−1) = 4 × 3 = 12."},
  {q:"A 6-combination trifecta for $3 total pays a $90 dividend. What do you collect?", o:["$90","$45","$15","$270"], a:1, why:"Flexi = $3 ÷ 6 = 50%. 50% of $90 = $45."},
  {q:"$20 at $6.00 ends in a two-way dead heat for first. What's your return?", o:["$120","$60","$40","$20"], a:1, why:"Stake halves to $10 at $6.00 = $60."},
  {q:"$10 at $5.00 wins after a 25c deduction. What's your return?", o:["$50","$37.50","$40","$30"], a:2, why:"Winnings $40 × 0.75 = $30, plus the $10 stake = $40."}
 ]
},
{
 id:"value", part:2, title:"Thinking about betting situations", blurb:"Value, expected value, the longshot bias, Kelly staking and variance.",
 lead:"A bet is worth making only when your probability beats the price's implied probability by more than the margin. The goal isn't picking winners; it's finding prices that are too long.",
 body:`
<h2>Value and expected value</h2>
<p>A bet has <b>value</b> when the true chance of winning is higher than the price's implied probability. <b>Expected value (EV)</b> is what the bet wins or loses on average per $1.</p>
<div class="formula">EV per $1 = p × Odds − 1 &nbsp;&nbsp;(p = your probability)</div>
<div data-w="ev"></div>
<div class="tbl"><table><tr><th class="n">Your p</th><th class="n">Price</th><th class="n">Implied</th><th class="n">EV per $1</th><th>Verdict</th></tr>
<tr><td class="n">30%</td><td class="n">$4.00</td><td class="n">25.0%</td><td class="n">+$0.20</td><td>Value</td></tr>
<tr><td class="n">25%</td><td class="n">$4.00</td><td class="n">25.0%</td><td class="n">$0.00</td><td>Break-even</td></tr>
<tr><td class="n">60%</td><td class="n">$1.50</td><td class="n">66.7%</td><td class="n">−$0.10</td><td>Likely winner, bad bet</td></tr>
<tr><td class="n">8%</td><td class="n">$15.00</td><td class="n">6.7%</td><td class="n">+$0.20</td><td>Unlikely winner, good bet</td></tr></table></div>
<div class="key"><b>Key idea</b>The most likely winner can be a bad bet, and an outsider can be a good one. Value is about the price, not the horse.</div>

<h2>Removing the margin</h2>
<p>To compare your view with the market's, strip out the overround first. The simplest way divides each implied probability by the market total (the market calculator in Chapter 7 does this in its last column). In a 109.9% market, a $2.80 horse goes from 35.7% implied to 35.7 ÷ 1.099 = <b>32.5%</b>.</p>
<p>This <b>proportional method</b> spreads the margin evenly. Bookmakers actually load more of it onto outsiders, so other methods (power, Shin, odds-ratio) often fit real results better. Which brings us to…</p>

<h2>The favourite–longshot bias</h2>
<p>Across racing markets worldwide, <b>outsiders win less often than their prices imply, and favourites slightly more often</b>. Punters overpay for long shots, so the loss per dollar is usually much worse at $30 than at $3.</p>
<ul><li>The market's probabilities are biased, not just noisy. Correct for it before calling a long shot an overlay.</li>
<li>A model that only "wins" on long shots is probably just finding this bias.</li></ul>

<h2>Break-even strike rate</h2>
<p>Your <b>strike rate</b> is the share of bets that win. To break even it must at least equal 1 ÷ your average price: 25% at $4.00, 10% at $10.00. A 30% strike rate at an average of $3.00 still loses 10%.</p>
<p><b>ROI</b> (or POT, profit on turnover) = profit ÷ total staked. +5% over 2,000 bets is strong; +40% over 30 bets tells you almost nothing.</p>

<h2>How much to bet: Kelly</h2>
<p>The <b>Kelly criterion</b> gives the share of your bankroll that grows it fastest, for a given edge. The EV calculator above shows it. Full Kelly assumes your probabilities are exactly right; they never are, so most serious bettors use a quarter or half of it.</p>
<div class="formula">Kelly fraction = (p × Odds − 1) ÷ (Odds − 1)</div>

<h2>Variance: why short runs mislead</h2>
<p>Even a real edge brings long losing runs. Simulate a season below: each line is one bettor making the same bets with the same edge.</p>
<div data-w="sim"></div>
<div class="tbl"><table><tr><th class="n">Win chance</th><th class="n">Lose 5 in a row</th><th class="n">Lose 10 in a row</th></tr>
<tr><td class="n">50%</td><td class="n">3.1%</td><td class="n">0.1%</td></tr><tr><td class="n">25%</td><td class="n">23.7%</td><td class="n">5.6%</td></tr><tr><td class="n">10%</td><td class="n">59.0%</td><td class="n">34.9%</td></tr></table></div>

<h2>Common situations</h2>
<div class="tbl"><table><tr><th>Situation</th><th>How to think about it</th></tr>
<tr><td>Tote or fixed odds?</td><td>Fixed locks your price. The tote can pay more on horses the crowd ignores, but you don't know the dividend until the jump.</td></tr>
<tr><td>Each way or win only?</td><td>Only if the place part is value too. Work out the EV of each half separately.</td></tr>
<tr><td>A horse firms $6.00 → $4.00</td><td>The market now rates it more likely. Unless you know something it doesn't, your edge has shrunk.</td></tr>
<tr><td>Late scratching after your bet</td><td>Expect a deduction if the scratched horse was short in the market.</td></tr>
<tr><td>A big multi</td><td>Margins compound (133% over three 110% legs). Usually worse value than singles.</td></tr>
<tr><td>Trifecta or First Four</td><td>Bigger takeout (20%+) and many combinations. Only worth it if your view of the minor places is much sharper than the market's.</td></tr></table></div>`,
 quiz:[
  {q:"You rate a $6.00 horse at 20%. What's the EV per $1?", o:["−$0.20","$0.00","+$0.20","+$1.20"], a:2, why:"0.20 × 6 − 1 = +0.20."},
  {q:"Which is the value bet?", o:["A 60% chance at $1.50","A 10% chance at $12.00","A 25% chance at $3.50","A 50% chance at $1.90"], a:1, why:"Only 0.10 × 12 = 1.20 is above 1. The others are below break-even."},
  {q:"Your bets average $5.00. What strike rate do you need to break even?", o:["5%","15%","20%","50%"], a:2, why:"1 ÷ 5 = 20%."},
  {q:"You rate a $2.50 horse at 50%. What does full Kelly say to bet?", o:["50% of bankroll","25%","16.7%","Nothing"], a:2, why:"(0.5 × 2.5 − 1) ÷ 1.5 = 0.25 ÷ 1.5 = 16.7%."},
  {q:"The favourite–longshot bias means…", o:["Favourites never win","Outsiders win less often than their prices imply","Bookmakers favour long shots","Long shots are always value"], a:1, why:"Punters overpay for long shots, so they win less often than their odds suggest."}
 ]
},
{
 id:"model", part:2, title:"Connecting it to your model", blurb:"Race probabilities, blending with the market, measuring an edge, traps to avoid.",
 lead:"To find mispriced horses, your model needs probabilities that add to 100% in each race, judged against the margin-free market. A ranking alone can't tell you whether a price is too long.",
 body:`
<h2>From scores to race probabilities</h2>
<p>Most models give each horse a score. The standard way to turn scores into win probabilities within a race is the <b>softmax</b> (in racing, the conditional logit, made famous by Bill Benter's Hong Kong model). It guarantees each race's probabilities sum to 100%, and Harville (Chapter 9) then gives every finishing order.</p>
<div class="formula">pᵢ = e^(sᵢ) ÷ Σ e^(sⱼ) &nbsp;&nbsp;(over the horses in the race)</div>
<div data-w="softmax"></div>

<h2>Blend with the market, then measure against it</h2>
<p>A key finding in racing research: the <b>best models combine their own view with the market's</b>. Fit a fundamental model on form, class, weight, barrier and track; then blend its probabilities with the margin-free market in a second model. The blend usually beats both.</p>
<p>So "can the model predict discrepancies in the odds?" becomes: <b>does the blend beat the market's probabilities on races it hasn't seen?</b></p>

<h2>How to measure it</h2>
<div class="tbl"><table><tr><th>Measure</th><th>Tells you</th><th>Good result</th></tr>
<tr><td>Log loss on the winner</td><td>How much probability you gave the actual winner</td><td>Lower than the market's</td></tr>
<tr><td>Brier score</td><td>Average squared error of your probabilities</td><td>Lower than the market's</td></tr>
<tr><td>Calibration plot</td><td>Do your 20% horses win about 20% of the time?</td><td>Close to the diagonal</td></tr>
<tr><td>Spearman rank correlation</td><td>Predicted order vs finishing order</td><td>Higher than the market's ranking</td></tr>
<tr><td>Simulated ROI at final price</td><td>Profit betting whenever EV &gt; 0</td><td>Positive over thousands of bets</td></tr>
<tr><td>ROI by price band</td><td>Whether profit comes only from long shots</td><td>Positive across bands</td></tr></table></div>
<div class="key"><b>Key idea</b>The market is your baseline for every measure. Beating a random guess is easy; beating the final market is the real test.</div>

<h2>Traps to avoid</h2>
<ul>
<li><b>Look-ahead leakage:</b> never use anything not known before the race (like the final price) as a pre-race feature. Store prices with timestamps.</li>
<li><b>Wrong test price:</b> backtest at prices you could really have taken. "Best price of the day" flatters the model.</li>
<li><b>Ignoring the margin:</b> a 5% edge on the margin-free market vanishes in a 10% overround.</li>
<li><b>Small samples:</b> a few hundred races can't separate a 2% edge from luck. Hold out later seasons and test on them once.</li>
<li><b>Scratchings:</b> recalculate for the final field, not the acceptors.</li>
<li><b>Dead heats and abandonments:</b> decide up front how your data records them.</li>
</ul>

<h2>Data to collect for each runner</h2>
<div class="tbl"><table><tr><th>Group</th><th>Fields</th></tr>
<tr><td>Race</td><td>Date, venue, distance, class, prize money, track condition, rail, field size</td></tr>
<tr><td>Runner</td><td>Barrier, weight, apprentice claim, jockey, trainer, age, sex, days since last run</td></tr>
<tr><td>Form</td><td>Recent finishes, margins, classes, track conditions</td></tr>
<tr><td>Market</td><td>Opening price, prices at set times before the jump, final fixed price, tote win and place dividends</td></tr>
<tr><td>Result</td><td>Finishing position, margin, dead heat or scratching flags</td></tr></table></div>`,
 quiz:[
  {q:"Why use softmax to turn model scores into probabilities?", o:["It's faster","It makes each race's probabilities add to 100%","It removes the bias","It predicts dividends"], a:1, why:"Softmax normalises within a race, so the probabilities sum to 1."},
  {q:"Which of these is look-ahead leakage?", o:["Using the barrier","Using last start's margin","Using the final starting price as a pre-race feature","Using track condition"], a:2, why:"The final price isn't known when you'd place an early bet."},
  {q:"What is the right baseline to beat?", o:["Random guessing","Always backing barrier 1","The margin-free market probabilities","Last year's winner"], a:2, why:"The market already uses most public information. Beating it is the real test."}
 ]
},
{
 id:"exchange", part:3, title:"Reading the Betfair exchange", blurb:"Back and lay columns, the money available, the two market percentages, commission and BSP.",
 lead:"On an exchange you aren't betting against a bookmaker. Every price is an offer from another punter, and the screen is a live list of those offers. Once you know what each column is, it's the cleanest view of the market's opinion you can get.",
 body:`
<h2>A practice screen</h2>
<p>This is a simplified, made-up market laid out the way an exchange win market is. <b>Tap any number</b> to see what it means and how it fits the maths from earlier chapters.</p>
<div data-w="bfscreen"></div>
<p class="note">On a phone, the exchange's app usually shows only the best back and best lay price for each runner: the darker pair in the middle. This practice screen hides the outer prices on narrow screens too.</p>

<h2>Back and lay</h2>
<ul>
<li><b>Back (blue):</b> bet that the horse <b>wins</b>, just like a normal bet. The blue numbers are prices other punters are offering to lay to you.</li>
<li><b>Lay (pink):</b> bet that the horse <b>loses</b>. You act as the bookmaker: you take someone else's stake if the horse loses and pay their winnings if it wins.</li>
<li>The <b>best</b> back price is the highest blue one (the darker blue box), and the <b>best</b> lay price is the lowest pink one (the darker pink box). They sit next to each other in the middle, under the <b>Back all</b> and <b>Lay all</b> buttons. The gap between them is the <b>spread</b>.</li>
<li>The <b>$ amount</b> under each price is how much money is waiting to be matched at that price. Bet more than that and the rest waits, unmatched, until someone takes it.</li>
</ul>

<h2>The two percentages at the top</h2>
<p>Next to <b>Back all</b> is the <b>back book %</b>: add up 1 ÷ the best back price for every runner. Next to <b>Lay all</b> is the <b>lay book %</b>: the same with the best lay prices. On a busy market near the jump, the back book is often just over 100% and the lay book just under. Compare that with a bookmaker's 110% or the tote's 117% (Chapter 7): there's very little margin built into exchange prices.</p>
<div class="formula">Back book % = Σ (1 ÷ best back price)<br>Lay book % = Σ (1 ÷ best lay price)</div>
<div class="key"><b>Key idea</b>The exchange's opinion of a horse's chance sits between 1 ÷ best lay and 1 ÷ best back. The middle of that range is one of the best free estimates of "true" probability you'll find, and a natural benchmark for your model.</div>

<h2>Busy markets and thin markets</h2>
<p>How far apart the two percentages are tells you how much to trust the prices. A real example: a mile race at a small US track, with only <b>AUD 25,101 matched</b>, showed <b>104.8%</b> next to Back all and <b>94.6%</b> next to Lay all. One runner was 9.4 to back but 10.5 to lay, and another was 95 to back but 140 to lay. With so little money matched, the spread is wide and the true price could be anywhere in that gap.</p>
<div class="tbl"><table><tr><th>Market</th><th class="n">Matched</th><th class="n">Back book</th><th class="n">Lay book</th><th>What it means</th></tr>
<tr><td>Thin (small overseas race, hours out)</td><td class="n">~$25k</td><td class="n">104.8%</td><td class="n">94.6%</td><td>Wide spreads; prices are a rough guide only</td></tr>
<tr><td>Busy (Saturday metro race, near the jump)</td><td class="n">$1m+</td><td class="n">~100–101%</td><td class="n">~99–100%</td><td>One-tick spreads; prices are a sharp estimate</td></tr></table></div>
<div class="key"><b>For your model</b>Only use exchange prices as a "true probability" benchmark when the market is busy and the two book percentages are close to 100%. Record the matched amount with every price you scrape, so you can filter out thin markets later.</div>

<h2>The form panel under the market</h2>
<p>Exchange race pages include a short form summary for each runner. For overseas races it's written in US racing shorthand. Here's one real line, from a two-year-old fillies' race over a mile at Horseshoe Indianapolis:</p>
<div class="ex"><b class="t">Example</b><i>Prayer For Music. 2y filly: 2 wins/3 runs, $86k 2026: 1/1, 2.75 lengths 1st of 9 from Q's Disco Dancer in $102k stks (6f dirt) at Horseshoe Indianapolis, 20 days ago: best effort at 6f: raced only on dirt: tracks pace: plenty to spare.</i></div>
<div class="tbl"><table><tr><th>Shorthand</th><th>Meaning</th></tr>
<tr><td>2y filly</td><td>Two-year-old female (Chapter 2)</td></tr>
<tr><td>2 wins/3 runs, $86k</td><td>Career record (3:2 in Australian notation) and prize money won</td></tr>
<tr><td>2026: 1/1</td><td>Its starting odds last run, US style: 1/1 is evens, a decimal $2.00. "1.3/1" would be $2.30</td></tr>
<tr><td>2.75 lengths 1st of 9 from X</td><td>Won by 2¾ lengths from X in a field of 9. "4th of 9 <b>to</b> X" means X won and this horse was beaten</td></tr>
<tr><td>$102k stks</td><td>A stakes race with a $102,000 purse: the US equivalent of a Listed or Group race</td></tr>
<tr><td>mdn / clm / alw</td><td>Maiden / claiming (horses can be bought out of the race) / allowance races</td></tr>
<tr><td>6f dirt</td><td>6 furlongs (about 1207 m) on a dirt track. 8f is a mile (about 1609 m)</td></tr>
<tr><td>front-runner, tracks pace, mid-field, races behind</td><td>Run style: leader, on-pace, midfield, backmarker (Chapter 4)</td></tr></table></div>
<div data-w="usform"></div>
<div class="key"><b>Reading a race through its form</b>Lines that share a race let you compare horses directly. In that example, four runners met in the same $102k stakes 44 days earlier, and Prayer For Music then beat the winner of that race. That's collateral form, and it helps explain why the exchange made her a strong favourite. Today's race is a mile, though, and her best form is at 6f, while several rivals have already won over 8f. That distance question is exactly what the market is weighing.</div>

<h2>Commission: the hidden cost</h2>
<p>The exchange charges <b>commission on your net winnings in each market</b>, not on losing bets. The rate is the <b>Market Base Rate</b>, shown in the market's Rules. For Australian racing it ranges from about 7% to 10% depending on the state and code. Commission makes a price worth less than it looks:</p>
<div class="formula">Effective price = 1 + (Price − 1) × (1 − commission)</div>
<div data-w="bfback"></div>
<div class="key"><b>Compare properly</b>An exchange $5.00 at 8% commission is really $4.68. A TAB fixed price of $4.80 on the same horse would pay more, even though the exchange number looks bigger.</div>

<h2>Laying a horse</h2>
<p>When you lay, you choose the <b>backer's stake</b> you'll accept. If the horse loses, you win that stake (less commission). If it wins, you pay the backer's profit. That amount is your <b>liability</b>, and the exchange holds it from your balance until the race is settled.</p>
<div class="formula">Liability = Backer's stake × (Lay price − 1)</div>
<div data-w="bflay"></div>

<h2>Other things on the screen</h2>
<ul>
<li><b>Matched:</b> the total money already traded in this market. Bigger means more reliable prices.</li>
<li><b>Back all / Lay all:</b> buttons that put a bet on every runner at the best prices. The percentages beside them are the two books.</li>
<li><b>Top 3 Finish:</b> the place market for the same race, on its own tab with its own back and lay prices.</li>
<li><b>BSP (Betfair Starting Price):</b> a price calculated at the jump from the bets left over that asked for SP. It's the exchange's version of a starting price, and a good "closing price" for measuring CLV (Chapter 8).</li>
<li><b>Going in-play:</b> the market stays open during the race. Prices then swing wildly; in-play betting is a different skill.</li>
<li><b>Non Runner 0.5%, Sat 14 Nov 04:44:</b> a scratched horse, shown below the others. The percentage is its <b>reduction factor</b> (about its chance when it was withdrawn), and the time is when it was removed. Bets on other runners matched before then have their prices cut by that percentage, for backers and layers alike. It's the exchange version of a TAB deduction; at 0.5% almost nothing changes.</li>
<li><b>Ratings and tips panels</b> (like a 1-2-3 star rating under the market): a form service's opinion, not part of the market. Treat it like any tipster.</li>
</ul>

<h2>The price ladder</h2>
<p>Exchange prices move in fixed steps called <b>ticks</b>, and the step size grows as prices lengthen:</p>
<div class="tbl"><table><tr><th>Price range</th><th class="n">Tick size</th></tr>
<tr><td>1.01 – 2.00</td><td class="n">0.01</td></tr><tr><td>2.00 – 3.00</td><td class="n">0.02</td></tr><tr><td>3.00 – 4.00</td><td class="n">0.05</td></tr>
<tr><td>4.00 – 6.00</td><td class="n">0.10</td></tr><tr><td>6.00 – 10.0</td><td class="n">0.20</td></tr><tr><td>10.0 – 20.0</td><td class="n">0.50</td></tr>
<tr><td>20.0 – 30.0</td><td class="n">1</td></tr><tr><td>30.0 – 50.0</td><td class="n">2</td></tr><tr><td>50.0 – 100</td><td class="n">5</td></tr><tr><td>100 – 1000</td><td class="n">10</td></tr></table></div>
<p>So "one tick" on a favourite is a tiny move, while one tick on a $40 shot is a big one. When you measure market moves, use probabilities rather than ticks.</p>`,

function toFrac(x){
  if (Math.abs(x - 1) < 1e-9) return "evens";
  let best = [Math.round(x), 1], err = 1e9;
  for (let d = 1; d <= 20; d++){ const n = Math.round(x * d), e = Math.abs(n / d - x); if (n > 0 && e < err - 1e-9){ err = e; best = [n, d]; } if (e < 1e-6) break; }
  const g = (a, c) => c ? g(c, a % c) : a, k = g(best[0], best[1]);
  return (best[0] / k) + "/" + (best[1] / k);
}

W.sim = el => {
  const b = box(el, "Variance simulator: a season of bets", `<div class="fields">${field("sp","True win chance (%)","12")}${field("so","Price ($)","9.00")}${field("sn","Bets in a season","300")}</div>
    <button class="btn" id="sgo">Run 6 seasons</button><div class="chart" id="sch" style="margin-top:12px"></div><div class="out" id="sout"></div>`);
  const run = () => {
    const p = num($("#sp", b).value) / 100, o = num($("#so", b).value), n = Math.min(5000, Math.max(10, Math.floor(num($("#sn", b).value) || 0)));
    if (!(p > 0 && p < 1 && o > 1)){ $("#sout", b).innerHTML = `<p class="note">Check the inputs.</p>`; return; }
    const paths = [], streaks = [];
    for (let r = 0; r < 6; r++){ let bal = 0, cur = 0, worst = 0; const path = [0];
      for (let i = 0; i < n; i++){ if (Math.random() < p){ bal += o - 1; cur = 0; } else { bal -= 1; cur++; worst = Math.max(worst, cur); } path.push(bal); }
      paths.push(path); streaks.push(worst); }
    const all = paths.flat(), lo = Math.min(...all, 0), hi = Math.max(...all, 0), Wd = 600, H = 240, pad = 34;
    const X = i => pad + i / n * (Wd - pad - 8), Y = v => 10 + (hi - v) / ((hi - lo) || 1) * (H - 30);
    const cols = ["#2f7d58","#c4302b","#2456a6","#b98a2e","#6b3fa0","#d0611b"];
    const step = Math.max(1, Math.floor(n / 300));
    const lines = paths.map((pth, r) => `<polyline fill="none" stroke="${cols[r]}" stroke-width="2" points="${pth.filter((_, i) => i % step === 0 || i === n).map((v, j, arr) => X(j === arr.length - 1 ? n : j * step).toFixed(1) + "," + Y(v).toFixed(1)).join(" ")}"/>`).join("");
    const ev = n * (p * o - 1);
    $("#sch", b).innerHTML = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Profit paths for six simulated seasons">
      <line x1="${pad}" x2="${Wd - 8}" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".35" stroke-dasharray="4 4"/>
      <line x1="${X(0)}" x2="${X(n)}" y1="${Y(0)}" y2="${Y(ev)}" stroke="currentColor" stroke-opacity=".7" stroke-width="2.5" stroke-dasharray="8 5"/>
      ${lines}
      <text x="4" y="${Y(hi) + 4}" font-size="19" fill="currentColor" font-family="IBM Plex Mono">${hi >= 0 ? "+" : ""}${Math.round(hi)}</text>
      <text x="4" y="${Y(lo)}" font-size="19" fill="currentColor" font-family="IBM Plex Mono">${Math.round(lo)}</text>
      <text x="4" y="${Y(0) + 4}" font-size="19" fill="currentColor" font-family="IBM Plex Mono">0</text>
      <text x="${Wd - 10}" y="${H - 4}" font-size="19" fill="currentColor" text-anchor="end" font-family="IBM Plex Mono">bet ${n}</text></svg>
      <p class="note" style="margin-top:4px">Profit in $1 units. The dashed diagonal is the expected result; each coloured line is one season.</p>`;
    const finals = paths.map(x => x[n]);
    $("#sout", b).innerHTML = stat("Expected profit", (ev >= 0 ? "+" : "") + ev.toFixed(1) + " units", "hi") + stat("Best season", "+" + Math.max(...finals).toFixed(1).replace("+-", "-")) +
      stat("Worst season", Math.min(...finals).toFixed(1)) + stat("Longest losing run", Math.max(...streaks) + " bets") + stat("Seasons in profit", finals.filter(x => x > 0).length + " of 6");
  };
  $("#sgo", b).addEventListener("click", run); run();
};

W.record = el => {
  const b = box(el, "Record reader: starts:wins-seconds-thirds", `<div class="fields">${field("rr","Record","8:3-2-1")}${field("rp","Today's win price ($, optional)","3.50")}</div><div class="out" id="ro"></div>`);
  const wilson = (k, n, z = 1.96) => { const p = k / n, d = 1 + z * z / n, c = (p + z * z / (2 * n)) / d, h = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d; return [Math.max(0, c - h), Math.min(1, c + h)]; };
  wire(b, () => {
    const m = $("#rr", b).value.replace(/\s/g, "").match(/^(\d+):(\d+)-(\d+)-(\d+)$/), price = num($("#rp", b).value);
    if (!m){ $("#ro", b).innerHTML = `<p class="note">Use the form starts:wins-seconds-thirds, e.g. 8:3-2-1.</p>`; return; }
    const [n, w, s2, t] = m.slice(1).map(Number), pl = w + s2 + t;
    if (n === 0 || pl > n){ $("#ro", b).innerHTML = `<p class="note">Wins, seconds and thirds can't add up to more than the starts.</p>`; return; }
    const [lo, hi] = wilson(w, n);
    let html = stat("Win strike rate", pct(w / n, 0), "hi") + stat("Top-three rate", pct(pl / n, 0)) + stat("Unplaced", (n - pl) + " of " + n) +
      stat("Plausible true win rate (95%)", pct(lo, 0) + " – " + pct(hi, 0));
    if (price > 1) html += stat("Price implies", pct(1 / price)) +
      `<p class="note" style="grid-column:1/-1">${1 / price < lo ? "The price implies less than even the low end of the range: on this record alone the horse looks underrated, but check its other form." : 1 / price > hi ? "The price implies more than the top of the range: the market rates it higher than this record alone suggests." : "The price sits inside the plausible range, so this record alone can't tell you the price is wrong."}</p>`;
    $("#ro", b).innerHTML = html;
  });
};

W.speed = el => {
  const b = box(el, "Speed, sectionals and margins", `<div class="fields">${field("sd","Distance (m)","1200")}${field("st2","Race time (m:ss.hh or seconds)","1:10.00")}${field("s6","Last 600 m time (s, optional)","34.50")}${field("sl","Beaten margin (lengths)","2")}</div><div class="out" id="spo"></div>`);
  const secs = v => { v = String(v).trim(); const m = v.match(/^(\d+):(\d+(?:\.\d+)?)$/); return m ? +m[1] * 60 + +m[2] : num(v); };
  wire(b, () => {
    const d = num($("#sd", b).value), t = secs($("#st2", b).value), l6 = num($("#s6", b).value), len = num($("#sl", b).value);
    if (!(d > 0 && t > 0)){ $("#spo", b).innerHTML = `<p class="note">Enter a distance and a time.</p>`; return; }
    const v = d / t;
    let html = stat("Average speed", (v * 3.6).toFixed(1) + " km/h", "hi") + stat("Metres per second", v.toFixed(2)) + stat("Average per 200 m", (200 / v).toFixed(2) + " s");
    if (l6 > 0 && d > 600){ const early = (t - l6) / ((d - 600) / 200), late = l6 / 3;
      html += stat("Early part, per 200 m", early.toFixed(2) + " s") + stat("Last 600 m, per 200 m", late.toFixed(2) + " s", late < early ? "good" : "bad") +
        `<p class="note" style="grid-column:1/-1">${late < early ? "The last 600 m was faster than the early part: a slow-early, sprint-home race that tends to suit on-pace horses." : "The last 600 m was slower than the early part: a fast-early race where the leaders tired, which tends to suit closers."}</p>`; }
    if (len >= 0 && isFinite(len)) html += stat(`${len} lengths ≈`, (len * 2.4).toFixed(1) + " m") + stat("…which at this speed is", (len * 2.4 / v).toFixed(2) + " s");
    $("#spo", b).innerHTML = html;

W.path = el => {
  const b = box(el, "Price path: raw price vs margin-free chance", `<p class="note" style="margin-top:0">One line per time point: <b>label, price, market total %</b>.</p>
    <label class="f">Price history<textarea id="pth" rows="5" style="font:500 15px var(--mono);padding:9px 10px;border-radius:9px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);width:100%">Open, 5.00, 120
Wed, 5.00, 116
Race morning, 4.80, 112
1 hour, 4.60, 110
Jump, 4.60, 108</textarea></label><div class="chart" id="pch" style="margin-top:12px"></div><div class="out" id="pto"></div>`);
  $("#pth", b).addEventListener("input", draw); draw();
  function draw(){
    const pts = $("#pth", b).value.split("\n").map(l => l.split(",").map(x => x.trim())).filter(r => r.length >= 2 && num(r[1]) > 1)
      .map(([lab, pr, mt]) => { const o = num(pr), t = num(mt) / 100; return {lab, o, raw: 1 / o, mf: t > 0 ? (1 / o) / t : 1 / o}; });
    if (pts.length < 2){ $("#pch", b).innerHTML = ""; $("#pto", b).innerHTML = `<p class="note">Enter at least two lines.</p>`; return; }
    const Wd = 600, H = 240, padL = 52, padR = 12, all = pts.flatMap(p => [p.raw, p.mf]), lo = Math.min(...all) * 0.9, hi = Math.max(...all) * 1.08;
    const X = i => padL + i / (pts.length - 1) * (Wd - padL - padR), Y = v => 12 + (hi - v) / (hi - lo) * (H - 44);
    const line = (k, col, dash) => `<polyline fill="none" stroke="${col}" stroke-width="3" ${dash ? 'stroke-dasharray="7 5"' : ""} points="${pts.map((p, i) => X(i) + "," + Y(p[k])).join(" ")}"/>` +
      pts.map((p, i) => `<circle cx="${X(i)}" cy="${Y(p[k])}" r="4" fill="${col}"/>`).join("");
    const ticks = [lo, (lo + hi) / 2, hi].map(v => `<text x="4" y="${Y(v) + 4}" font-size="19" fill="currentColor" font-family="IBM Plex Mono">${(v * 100).toFixed(0)}%</text>`).join("");
    const labs = pts.map((p, i) => `<text x="${X(i)}" y="${H - 8}" font-size="19" fill="currentColor" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${p.lab.replace(/</g, "")}</text>`).join("");
    $("#pch", b).innerHTML = `<svg viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Implied and margin-free probability over time">${ticks}${line("raw", "#b98a2e", true)}${line("mf", "#2f7d58", false)}${labs}</svg>
      <p class="note" style="margin-top:4px"><span style="color:#b98a2e">- - Raw implied (1 ÷ price)</span> &nbsp; <span style="color:#2f7d58">— Margin-free chance</span></p>`;
    const a = pts[0], z = pts[pts.length - 1], rawMove = z.raw - a.raw, mfMove = z.mf - a.mf;
    $("#pto", b).innerHTML = stat("Price", money(a.o) + " → " + money(z.o)) + stat("Raw implied move", (rawMove >= 0 ? "+" : "") + (rawMove * 100).toFixed(1) + " pts") +
      stat("Margin-free move", (mfMove >= 0 ? "+" : "") + (mfMove * 100).toFixed(1) + " pts", "hi " + (mfMove >= 0 ? "good" : "bad")) +
      stat("Verdict", Math.abs(mfMove) < 0.01 ? "Steady" : mfMove > 0 ? "Firmed" : "Drifted");
  }
};

W.clv = el => {
  const b = box(el, "Closing line value calculator", `<div class="fields">${field("ct","Price you took ($)","5.00")}${field("cf","Final price ($)","4.00")}${field("cm","Final market total (%)","110")}${field("cs","Stake ($)","10")}</div><div class="out" id="co"></div>`);
  wire(b, () => {
    const t = num($("#ct", b).value), f = num($("#cf", b).value), m = num($("#cm", b).value) / 100, s = num($("#cs", b).value);
    if (!(t > 1 && f > 1 && m > 0)){ $("#co", b).innerHTML = `<p class="note">Prices must be above $1.00.</p>`; return; }
    const raw = t / f - 1, pc = (1 / f) / m, edge = pc * t - 1;
    $("#co", b).innerHTML = stat("Raw CLV", (raw >= 0 ? "+" : "") + pct(raw), raw >= 0 ? "good" : "bad") + stat("Margin-free chance at close", pct(pc)) +
      stat("Fair closing price", money(1 / pc)) + stat("Edge vs close", (edge >= 0 ? "+" : "") + pct(edge), "hi " + (edge >= 0 ? "good" : "bad")) +
      stat("Expected profit on stake", isFinite(s) ? (edge >= 0 ? "+" : "") + money(s * edge) : "–") +
      `<p class="note" style="grid-column:1/-1">${edge > 0 ? "If the closing market was right, this bet was worth more than it cost." : raw > 0 ? "You beat the raw closing price, but not by enough to cover the margin: against the fair closing price this bet was still negative." : "The market moved against you: the closing market rated this horse less likely than your price implied."}</p>`;
  });
};

W.clvlog = el => {
  const b = box(el, "Bet log: are you beating the close?", `<p class="note" style="margin-top:0">One bet per line: <b>price taken, final price, won (1 or 0)</b>. Paste your simulated bets to summarise them.</p>
    <label class="f">Bets<textarea id="cl" rows="7" style="font:500 15px var(--mono);padding:9px 10px;border-radius:9px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);width:100%">5.00, 4.20, 0
3.50, 3.10, 1
8.00, 9.00, 0
2.80, 2.50, 0
12.00, 9.50, 0
4.40, 4.00, 1
6.50, 7.00, 0</textarea></label>${field("cmt","Typical closing market total (%)","110")}<div class="out" id="clo" style="margin-top:12px"></div>`);
  wire(b, () => {
    const m = num($("#cmt", b).value) / 100, rows = $("#cl", b).value.split("\n").map(l => l.split(",").map(num)).filter(r => r[0] > 1 && r[1] > 1);
    if (!rows.length || !(m > 0)){ $("#clo", b).innerHTML = `<p class="note">Add at least one line like 5.00, 4.20, 0.</p>`; return; }
    const n = rows.length, beat = rows.filter(r => r[0] > r[1]).length, avgRaw = rows.reduce((a, r) => a + r[0] / r[1] - 1, 0) / n,
      avgEdge = rows.reduce((a, r) => a + ((1 / r[1]) / m) * r[0] - 1, 0) / n, settled = rows.filter(r => r[2] === 0 || r[2] === 1),
      profit = settled.reduce((a, r) => a + (r[2] === 1 ? r[0] - 1 : -1), 0);
    $("#clo", b).innerHTML = stat("Bets", n) + stat("Beat the close", beat + " of " + n + " (" + pct(beat / n, 0) + ")") +
      stat("Average raw CLV", (avgRaw >= 0 ? "+" : "") + pct(avgRaw)) + stat("Average edge vs fair close", (avgEdge >= 0 ? "+" : "") + pct(avgEdge), "hi " + (avgEdge >= 0 ? "good" : "bad")) +
      stat("Actual profit (units)", (profit >= 0 ? "+" : "") + profit.toFixed(2)) + stat("Actual ROI", settled.length ? (profit >= 0 ? "+" : "") + pct(profit / settled.length) : "–") +
      `<p class="note" style="grid-column:1/-1">With only ${n} bets, actual profit is mostly luck. The average edge against the fair closing price is the more reliable signal; watch whether it stays positive as the log grows into the hundreds.</p>`;
  });
};

W.bfback = el => {

};

W.tabscreen = el => {

    <div class="tbl"><table class="tabc"><thead><tr><th colspan="2"></th><th colspan="3" class="desk"></th><th colspan="2" class="grp" data-k="fixedhdr" tabindex="0">FIXED ODDS</th><th colspan="2" class="grp" data-k="poolhdr" tabindex="0">POOL</th></tr>
    <tr><th>No</th><th>Runner (Barrier)</th><th class="c desk" data-k="form" tabindex="0">Form*</th><th class="c desk" data-k="wt" tabindex="0">Weight</th><th class="c desk" data-k="sr" tabindex="0">Sky Rating</th><th class="c" data-k="fixedhdr" tabindex="0">Win</th><th class="c" data-k="fixedhdr" tabindex="0">Place</th><th class="c" data-k="poolhdr" tabindex="0">Win</th><th class="c" data-k="poolhdr" tabindex="0">Place</th></tr></thead>

  const draw = () => { $("tbody", b).innerHTML = TAB.map(row).join(""); $("[data-k=fixflucs]", b).classList.toggle("on", showFix); $("[data-k=poolflucs]", b).classList.toggle("on", showPool); };

      allform: `<b>Show All Form.</b> Expands the full form guide under every runner: past runs, margins, track and distance records.`,
