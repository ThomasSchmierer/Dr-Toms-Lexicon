<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Moira's Lexicon</title>
<meta name="description" content="A word-of-the-day game: guess the meanings and origins of the strangest words from TV.">


<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,400..700,0..100&family=Libre+Franklin:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one theatrical card per day. Edition tabs on top, a character card sets the scene,
   the word is the marquee, the reveal unfolds as a dictionary entry. Dark-first. */
:root{
  --bg:#1a1218; --stage:#241821; --ink:#f3e9ee; --muted:#b8a2ae; --rule:#43303c;
  --gilt:#d9b46a; --gilt-ink:#1a1218; --rouge:#e0607e; --field:#2d1f29;
  --good:#7fcf9a; --mid:#e6c065; --low:#e57a7a;
  --sc:#c9a9d6; --da:#8fc6a0; --bk:#e08a6f; --kk:#f28cc0; --gl:#d9b46a; --fr:#e6b989; --bk1:#e08a6f; --bk2:#e08a6f; --bk4:#e08a6f; --toi:#8fb6e8; --ft:#a8d18f;
  --l-latin:#e0a36b; --l-greek:#8fb6e8; --l-french:#a8a2f0; --l-oldenglish:#b9c47a; --l-english:#d9b46a; --l-norse:#7fc9d1; --l-german:#9ccf8a; --l-dutch:#f0a35e; --l-italian:#e88f8f; --l-spanish:#f2c46b; --l-arabic:#6fd1b4; --l-persian:#d38fd1; --l-indic:#f29bb5; --l-celtic:#86d49a; --l-hebrew:#9fb4f0; --l-other:#c0b4ba;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f7eef1; --stage:#fffafb; --ink:#2a1622; --muted:#7a5d6c; --rule:#e6d3db;
  --gilt:#9a6f1f; --gilt-ink:#fffafb; --rouge:#b8335a; --field:#f4e7ec;
  --good:#2f8a52; --mid:#8a6810; --low:#b84242;
  --sc:#6e3f86; --da:#2f6b45; --bk:#9c3a22; --kk:#b8306f; --gl:#9a6f1f; --fr:#8a5a1c; --bk1:#9c3a22; --bk2:#9c3a22; --bk4:#9c3a22; --toi:#2c5d9e; --ft:#3b7a2a;
  --l-latin:#a85a1c; --l-greek:#2c5d9e; --l-french:#5a4fc0; --l-oldenglish:#5f6b1f; --l-english:#8a6410; --l-norse:#1f7480; --l-german:#3b7a2a; --l-dutch:#b0581a; --l-italian:#a83a3a; --l-spanish:#93680f; --l-arabic:#1d7a62; --l-persian:#8a3a88; --l-indic:#b03a62; --l-celtic:#2a7a40; --l-hebrew:#3a52a8; --l-other:#6e5f66; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f7eef1; --stage:#fffafb; --ink:#2a1622; --muted:#7a5d6c; --rule:#e6d3db;
  --gilt:#9a6f1f; --gilt-ink:#fffafb; --rouge:#b8335a; --field:#f4e7ec;
  --good:#2f8a52; --mid:#8a6810; --low:#b84242;
  --sc:#6e3f86; --da:#2f6b45; --bk:#9c3a22; --kk:#b8306f; --gl:#9a6f1f; --fr:#8a5a1c; --bk1:#9c3a22; --bk2:#9c3a22; --bk4:#9c3a22; --toi:#2c5d9e; --ft:#3b7a2a;
  --l-latin:#a85a1c; --l-greek:#2c5d9e; --l-french:#5a4fc0; --l-oldenglish:#5f6b1f; --l-english:#8a6410; --l-norse:#1f7480; --l-german:#3b7a2a; --l-dutch:#b0581a; --l-italian:#a83a3a; --l-spanish:#93680f; --l-arabic:#1d7a62; --l-persian:#8a3a88; --l-indic:#b03a62; --l-celtic:#2a7a40; --l-hebrew:#3a52a8; --l-other:#6e5f66; color-scheme:light}
*{box-sizing:border-box}
html{font-variation-settings:"opsz" 24,"SOFT" 50}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
[hidden]{display:none!important}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-style:italic;font-size:1.6rem;font-weight:500;letter-spacing:-.01em}
.brand b{color:var(--gilt);font-weight:700;font-style:normal}
.stats{font-family:var(--mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats strong{color:var(--gilt)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px;border-radius:999px;border:1px solid var(--rule);background:transparent;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stage{background:var(--stage);border:1px solid var(--rule);border-radius:4px;padding:24px 22px;display:flex;flex-direction:column;gap:20px}
.banner{font-size:.92rem;border:1px dashed var(--gilt);border-radius:4px;padding:10px 12px;color:var(--ink)}
.banner b{color:var(--gilt)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card{display:flex;align-items:center;gap:14px;border-left:3px solid var(--show);padding-left:12px}
.mono{width:46px;height:46px;flex:none;border-radius:50%;border:1.5px solid var(--show);color:var(--show);display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:1.05rem}
.card .who{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.2}
.card .show{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.word{font-family:var(--display);font-weight:700;font-size:clamp(2.2rem,9vw,4rem);line-height:1;letter-spacing:-.02em;overflow-wrap:anywhere;text-wrap:balance;margin:6px 0 8px}
.pron{font-family:var(--mono);font-size:.9rem;color:var(--muted)}
.pron i{color:var(--rouge);font-style:normal}
label{font-weight:600;font-size:.95rem}
textarea,input[type=text]{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--rule);border-radius:3px;padding:12px;font:inherit}
textarea{min-height:88px;resize:vertical}
textarea:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--gilt);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:999px;padding:10px 18px;border:1px solid var(--rule);background:transparent;color:var(--ink)}
button.primary{background:var(--gilt);color:var(--gilt-ink);border-color:var(--gilt);font-weight:600}
button.link{border:0;padding:6px 2px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.quote{border-left:2px solid var(--rouge);padding:4px 0 4px 14px;font-family:var(--display);font-style:italic;font-size:1.15rem;line-height:1.4;margin:0}
.quote.ctx{font-style:normal;font-family:var(--body);font-size:1rem}
.checked{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;color:var(--muted);margin:6px 0 0}
.also{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.also li{border-left:2px solid var(--rule);padding:2px 0 2px 12px}
.also-src{font-size:.88rem;line-height:1.35}
.also-line{font-family:var(--display);font-style:italic;font-size:1rem;line-height:1.4;margin-top:3px}
.also-n{margin:8px 0 0;font-size:.88rem}
.quote .src{display:block;font-family:var(--mono);font-style:normal;font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
mark{background:none;color:var(--rouge);font-weight:700}
.result{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.dial{width:92px;height:92px;position:relative}
.dial svg{display:block}
.dial .n{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.7rem;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--display);font-style:italic;font-size:1.25rem;line-height:1.3}
.feedback{color:var(--muted);font-size:.95rem;margin-top:4px}
.yours{font-size:.9rem;color:var(--muted);margin:0} .yours em{color:var(--ink)}
.section{display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--rule);padding-top:18px}
.section h3{margin:0 0 4px;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);font-weight:500}
.section p{margin:0;max-width:62ch}
.def{font-family:var(--display);font-size:1.3rem;line-height:1.35}
.def b{color:var(--rouge)}
pre.share{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:.85rem;background:var(--field);border:1px solid var(--rule);border-radius:3px;padding:12px;overflow-x:auto}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border:1px solid var(--gilt);border-radius:999px;color:var(--gilt);letter-spacing:.06em}
.origin{display:flex;flex-direction:column;gap:14px}
.origin-main{display:flex;align-items:center;gap:16px;color:var(--lang)}
.origin-main > div{color:var(--ink)}
.origin-name{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1}
.journey{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.journey li{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--lang);font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}
.journey li span{color:var(--muted)}
.journey li.arrow{color:var(--muted);font-size:1rem;padding-bottom:14px}
.rar{letter-spacing:.12em;color:var(--gilt)}
.loading{padding:28px 0;text-align:center;color:var(--muted)}
.giflinks{margin:0;font-size:.92rem}
.giflinks a{color:var(--gilt);text-underline-offset:3px}
.modes .tab{border-style:dashed}
.modes .tab[aria-pressed="true"]{background:var(--gilt);color:var(--gilt-ink);border:1px solid var(--gilt)}
.hm-top{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:16px;align-items:center}
@media (max-width:460px){.hm-top{grid-template-columns:1fr}}
.gallows{width:100%;max-width:190px;height:auto;display:block;margin:0 auto;color:var(--ink)}
.gallows.lost{color:var(--low)}
.gallows .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:hmdraw .45s ease-out forwards}
@keyframes hmdraw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.gallows .draw{animation:none;stroke-dashoffset:0}}
.hm-side{display:flex;flex-direction:column;gap:12px;align-items:center}
.hm-count{font-family:var(--mono);font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.hm-count b{color:var(--ink);font-size:1rem}
.hint-card{border:1px solid var(--rule);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ws-h{margin:0 0 8px;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);font-weight:500}
.ws-w{font-family:var(--mono);font-style:normal;text-transform:uppercase;font-size:.85rem}
.ws-w.done{text-decoration:line-through;opacity:.5}
.ws-c.bonus{background:var(--rouge);color:var(--bg);border-color:var(--rouge)}
.ws-c.extra{border-color:var(--good)}
.hm-word{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hm-l{width:1.5em;min-height:1.5em;border-bottom:2px solid var(--ink);text-align:center;font-family:var(--display);font-size:1.6rem;font-weight:700}
.hm-l.miss{color:var(--low)} .hm-gap{width:.8em;font-size:1.6rem;text-align:center}
.keys{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px}
.key{padding:10px 0;border-radius:6px;font-family:var(--mono);font-weight:500}
.key.good{background:var(--good);color:var(--bg);border-color:var(--good)} .key.bad{opacity:.35}
.hints{display:flex;flex-direction:column;gap:8px}
.clue{display:flex;flex-direction:column;gap:4px}
.cline{font-family:var(--display);font-style:italic}
.csrc{font-family:var(--mono);font-style:normal;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ws{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;max-width:420px;width:100%;margin:0 auto;touch-action:manipulation}
.ws-c{aspect-ratio:1;padding:0;border-radius:4px;font-family:var(--mono);font-weight:500;font-size:clamp(.85rem,3.6vw,1.05rem);border:1px solid var(--rule);background:var(--field)}
.ws-c.found{background:var(--gilt);color:var(--gilt-ink);border-color:var(--gilt)} .ws-c.sel{outline:2px solid var(--rouge);outline-offset:-2px}
.clues{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:12px} .clues li.done{opacity:.65}
.ans{color:var(--gilt);text-transform:uppercase;font-family:var(--mono)}
.cw-wrap{overflow-x:auto;padding-bottom:4px}
.cw{display:grid;grid-template-columns:repeat(var(--cols),minmax(26px,36px));gap:2px;width:max-content;margin:0 auto}
.cw-x{aspect-ratio:1}
.cw-c{aspect-ratio:1;position:relative;padding:0;border-radius:2px;background:var(--field);border:1px solid var(--rule);font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--ink)}
.cw-c i{position:absolute;top:1px;left:3px;font-family:var(--mono);font-style:normal;font-size:.55rem;font-weight:400;color:var(--muted)}
.cw-c.word{border-color:var(--gilt)} .cw-c.cur{background:var(--gilt);color:var(--gilt-ink)} .cw-c.cur i{color:var(--gilt-ink)} .cw-c.wrong{color:var(--low)}
.cw-in{position:fixed;bottom:0;left:0;width:1px;height:1px;opacity:0;font-size:16px;border:0;padding:0}
.cw-bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--stage);padding:8px 0;z-index:2;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
.cw-lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.cw-lists h3{margin:0 0 6px;font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);font-weight:500}
.cw-lists ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.cw-clue{border:0;border-radius:6px;padding:6px 8px;text-align:left;width:100%;font-size:.92rem}
.cw-lists li.cur .cw-clue{background:var(--field)}
.picker{display:flex;flex-direction:column;gap:12px;border:1px solid var(--rule);border-radius:4px;padding:14px 16px;background:var(--stage)}
.pick-sum{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.chip.pick{cursor:pointer;font-style:normal;font-family:var(--body);font-size:.85rem;color:var(--ink)}
.chip.pick.on{background:var(--gilt);color:var(--gilt-ink);border-color:var(--gilt)}
select{width:100%;padding:10px;background:var(--field);color:var(--ink);border:1px solid var(--rule);border-radius:3px;font:inherit}
.verse{margin:0;border-left:2px solid var(--rouge);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:3px;font-family:var(--display);font-size:1.05rem;line-height:1.45}
.verse p{margin:0;color:var(--muted)} .verse p.cur{color:var(--ink);font-size:1.15rem}
.ctx-spk{display:block;font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.verse figcaption{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
a.brand{text-decoration:none;color:inherit}
.home{display:flex;flex-direction:column;gap:28px}
.hero{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.hero-title{font-family:var(--display);font-weight:700;font-size:clamp(2rem,7vw,3.1rem);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
.hero-title em{color:var(--rouge);font-style:italic;font-weight:600}
.hero-sub{max-width:54ch;color:var(--muted);margin:0;font-size:1.05rem}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin:0}
.stats-grid > div{background:var(--stage);padding:14px 16px}
.stats-grid dt{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stats-grid dd{margin:6px 0 0;font-family:var(--display);font-size:1.9rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stats-grid dd small{font-size:.85rem;color:var(--muted);font-weight:400;font-family:var(--body)}
.home-h{font-family:var(--mono);font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gilt);font-weight:500;margin:0 0 12px}
.ed-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.ed-card{border:1px solid var(--rule);border-top:3px solid var(--accent-ed, var(--gilt));border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--stage)}
.ed-card h3{font-family:var(--display);font-size:1.35rem;margin:0;line-height:1.15}
.ed-card .count{font-family:var(--mono);font-size:.72rem;color:var(--gilt);letter-spacing:.08em;text-transform:uppercase}
.ed-card p{margin:0;color:var(--muted);font-size:.95rem;flex:1}
.ed-card button{align-self:flex-start}
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px;margin:0;padding:0;list-style:none}
.ways li{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:.95rem}
.ways li b{font-family:var(--display);font-size:1.15rem;color:var(--ink)}
.you{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.95rem;color:var(--muted)}
.you b{color:var(--ink);font-variant-numeric:tabular-nums}
a.btnlink{display:inline-block;padding:10px 18px;border-radius:999px;border:1px solid var(--gilt);background:var(--gilt);color:var(--gilt-ink);text-decoration:none;font-weight:600}
.report summary{cursor:pointer;color:var(--muted);font-size:.9rem;text-decoration:underline;text-underline-offset:3px;width:max-content;max-width:100%}
.report[open]{border:1px solid var(--rule);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px}
.chip.rp-r{cursor:pointer;font-style:normal;font-family:var(--body);font-size:.85rem;color:var(--ink)}
.chip.rp-r.on{background:var(--rouge);color:var(--bg);border-color:var(--rouge)}
a.say{display:inline-block;margin-top:8px;font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;color:var(--gilt);text-underline-offset:3px}
.toast{font-size:.88rem;color:var(--good);min-height:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--display);font-style:italic;font-size:1rem;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;background:var(--field)}
.syn{display:flex;flex-direction:column;gap:6px}
.syn .head{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.syn .head b{color:var(--ink);font-weight:500}
.muted{color:var(--muted);font-size:.9rem}
footer{font-size:.78rem;color:var(--muted);text-align:center;max-width:62ch;margin:0 auto}
@media (max-width:460px){.result{grid-template-columns:1fr;justify-items:start}}
@media (prefers-reduced-motion: no-preference){.dial circle.arc{transition:stroke-dasharray .8s ease-out}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <a class="brand" id="home-link" href="./">Moira's <b>Lexicon</b></a>
      <div class="stats" id="stats"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs" aria-label="Editions"></nav>
    <nav class="tabs modes" id="modes" aria-label="Games"></nav>
  </header>
  <section id="home" class="home" hidden></section>

<script>
/* ===== Settings ===== */
const SITE_URL = "https://thomasschmierer.github.io/Moira-Lexicon/";            // e.g. "https://yourname.github.io/moira-lexicon/" so shared links point to your site

const LAUNCH = Date.UTC(2026, 10, 6);   // day No. 1 for every edition

const DB = JSON.parse(document.getElementById("db").textContent);
let THES = null, thesLoading = null;
function loadThes(){
  if (THES || thesLoading) return thesLoading;
  thesLoading = fetch("thesaurus.json").then(r => r.json()).then(d => { THES = d; }).catch(() => { THES = {syn:{}, forms:{}, failed:true}; });

}
const edLoads = {};
const FILES = {}, TEXTS = {};
const PREFIX = {"grand.json":"g:", "shakes.json":"s:", "study.json":"t:"};
function loadFile(f){
  if (!FILES[f]) FILES[f] = fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); }).then(d => {
    const p = PREFIX[f] || (f + ":");
    for (const [key, e] of Object.entries(d.words)){ compileEntry(e); if (d.plays || d.texts) e.corpus = true; DB.words[p + key] = e; }
    if (d.plays) for (const [k, v] of Object.entries(d.plays)) TEXTS[k] = {name:v[0], group:v[1], author:"William Shakespeare", kind:"play"};
    if (d.texts) for (const [k, v] of Object.entries(d.texts)) TEXTS[k] = {name:v[0], author:v[1], kind:v[2], group:"Study"};
    return d.order.map(k => p + k);
  });
  return FILES[f];
}
const MORE = {all:"approved-all.json", moira:"approved-moira.json", kathkim:"approved-kathkim.json"}, moreLoads = {}, moreDone = {};
function loadMore(k){
  if (!MORE[k]) return Promise.resolve();
  if (!moreLoads[k]) moreLoads[k] = fetch(MORE[k]).then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    Object.assign(DB.shows, d.shows || {});
    const E = DB.editions[k], have = new Set(E.order);
    for (const w of d.order || []){
      const e = d.words[w], key = "a:" + w; if (!e) continue;
      if (!DB.words[key]){ compileEntry(e); DB.words[key] = e; }
      if (!have.has(key)){ E.order.push(key); have.add(key); }
    }
  }).catch(() => {}).finally(() => { moreDone[k] = true; });

}
let COUNTS = null;

/* Every place a word turns up: other shows, plays and books (xref.json, built by tools/review.py) */
let XREF = null, xrefLoading = null;
function loadXref(){
  if (XREF || xrefLoading) return xrefLoading || Promise.resolve();
  xrefLoading = fetch("xref.json").then(r => r.ok ? r.json() : null).then(d => { XREF = d && d.fam ? d : {idx:{}, fam:{}}; })
    .catch(() => { XREF = {idx:{}, fam:{}}; }).then(() => {
      if (view !== "game") return;
      if (gameMode === "hangman" && G.hm && G.hm.done) renderHangman($("#stage"));
      else if (gameMode === "daily" && phase !== "guess" && !(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName))) render();
    });
  return xrefLoading;
}
function alsoList(e){
  if (!XREF) return null;
  const w = String(e.w).toLowerCase().replace(/\s*\(.*?\)\s*/g, " ").trim();
  const fam = XREF.fam[XREF.idx[w] || w] || [];
  const cur = stripTags(e.line || "").replace(/[…“”"\s]+/g, " ").trim();
  const here = e.corpus ? (e.src || "") : (DB.shows[e.show] || {}).name || "";
  const out = [], seen = new Set();
  for (const s of fam){
    const line = stripTags(s[3]).replace(/[…“”"\s]+/g, " ").trim();
    if (line === cur || (cur && line && (cur.includes(line) || line.includes(cur)))) continue;
    if (e.corpus && s[0] === here) continue;
    const k = s[0] + "|" + line; if (seen.has(k)) continue; seen.add(k); out.push(s);
  }
  if (e.corpus && e.occ){        // other plays and books from the word's own concordance
    const done = new Set([e.ctx ? e.ctx[0] : ""]);
    for (const o of e.occ){
      if (done.has(o[0]) || done.size > 6) continue; done.add(o[0]);
      const T = TEXTS[o[0]] || {name:o[0], kind:""}, play = T.kind === "play";
      if (out.some(s => s[0] === T.name)) continue;
      out.push([T.name, play ? (o[4] || "") : (T.author || ""), play ? `Act ${o[1]}, Scene ${o[2]}` : String(o[1] || ""), o[6], "", 2]);
    }
  }
  return out;
}
function alsoBlock(e, compact){
  const L = alsoList(e);
  if (L === null){ loadXref(); return ""; }
  if (!L.length) return "";
  const names = [...new Set(L.map(s => s[0]))];
  const item = s => `<li><div class="also-src"><b>${esc(s[0])}</b>${s[1] && s[1] !== s[0] ? ` · ${esc(s[1])}` : ""}${s[2] && s[2] !== s[0] ? ` <span class="muted">· ${esc(s[2])}</span>` : ""}</div>
    ${s[3] ? `<div class="also-line">“${s[3]}”</div>` : ""}</li>`;
  const picks = [];
  for (const s of L) if (picks.length < 2 && !picks.some(p => p[0] === s[0])) picks.push(s);   // two different shows or books
  if (picks.length < 2 && L.length > 1 && !compact) picks.push(L.find(s => !picks.includes(s)));
  const others = names.length - new Set(picks.map(p => p[0])).size;
  return `<div class="also-wrap"><h3>Also heard in</h3><ul class="also">${picks.slice(0, compact ? 1 : 2).map(item).join("")}</ul>
    ${others > 0 ? `<p class="muted also-n">…and in ${others} other ${others === 1 ? "place" : "places"}.</p>` : ""}</div>`;
}
const checkedNote = e => e.chk ? `<p class="checked">✓ Checked against ${e.chk === 2 ? "two dictionaries (WordNet and Wiktionary)" : "Wiktionary"}</p>` : "";
function loadEdition(k){
  const E = DB.editions[k];
  if (!E.src || E.order.length) return Promise.resolve();
  if (!edLoads[k]) edLoads[k] = Promise.all(E.src.map(loadFile)).then(lists => { E.order = [].concat(...lists); }).catch(() => { E.failed = true; });
  return edLoads[k];
}

const VERDICTS = [

/* ===== Storage (best effort) ===== */
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ===== Days ===== */
const pad = n => String(n).padStart(2,"0");
function today(){
  const d = new Date();
  const n = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - LAUNCH) / 864e5);
  return {n, no:n+1, key:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,
          label:d.toLocaleDateString(undefined,{weekday:"short", day:"numeric", month:"short"})};
}
const mod = (a,b) => ((a % b) + b) % b;
function hashKey(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const SHUFFLED = new Set(["all"]);      // editions that mix many shows: shuffle so no show dominates
function dailyPool(ed){
  const t = today().key;
  // checked words join the daily rotation the day after they're added, and only the rarer or longer ones
  let o = DB.editions[ed].order.filter(k => { const e = DB.words[k]; return e && (!e.day || (e.day <= t && ((e.rarity || 0) >= 4 || e.w.length >= 9))); });
  if (!SHUFFLED.has(ed)) return o;
  o = o.slice().sort((a, b) => hashKey(a + "|mix") - hashKey(b + "|mix") || (a < b ? -1 : 1));
  for (let i = 1; i < o.length; i++){        // keep the same show off consecutive days
    const sh = k => DB.words[k].show;
    if (sh(o[i]) !== sh(o[i-1])) continue;
    const j = o.findIndex((k, x) => x > i && sh(k) !== sh(o[i-1]));
    if (j > 0) [o[i], o[j]] = [o[j], o[i]];
  }
  return o;
}
function dailyKey(ed){
  const r = results(ed)[today().key];
  if (r && r.key && DB.words[r.key]) return r.key;   // keep the word you already played today
  if (r && !r.key){                                   // played before words were shuffled: same word as then
    const legacy = DB.editions[ed].order.filter(k => !/^[ax]:/.test(k));
    if (legacy.length) return legacy[mod(today().n, legacy.length)];
  }
  const o = dailyPool(ed); return o[mod(today().n, o.length)];
}
function results(ed){ return store.get("ml-"+ed, {}); }
function saveResult(ed, r){ const all = results(ed); r.key = r.key || dailyKey(ed); all[today().key] = r; store.set("ml-"+ed, all); }
function streak(ed){
  const all = results(ed); let s = 0; const d = new Date();
  if (!all[today().key]) d.setDate(d.getDate()-1);
  for (;;){ const k = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; if (!all[k]) break; s++; d.setDate(d.getDate()-1); }
  return s;
}

/* ===== Scoring: prebuilt lexicon ===== */
const STOP = new Set("a an the of to and or is it its be being been that this someone something who which person thing things when you your like kind sort type really very bit somewhat she he they them her his was were meant mean means trying say saying word".split(" "));
function stem(w){
  w = w.toLowerCase(); if (w.length <= 3) return w;
  const rules = [["iness","y"],["ness",""],["ingly",""],["edly",""],["ings",""],["ing",""],["ies","y"],["ied","y"],["ers",""],["er",""],["ed",""],["ly",""],["es",""],["s",""]];
  for (const [suf,rep] of rules){ if (w.endsWith(suf) && w.length - suf.length >= 3){ w = w.slice(0,-suf.length) + rep; break; } }
  if (w.length >= 5 && w.endsWith("e")) w = w.slice(0,-1);
  return w.length >= 5 ? w.replace(/(.)\1$/, "$1") : w;
}
const norm = t => " " + t.toLowerCase().replace(/[’']/g,"").replace(/[^a-z\s-]/g," ").replace(/-/g," ").replace(/\s+/g," ").trim() + " ";
const toks = t => norm(t).trim().split(" ").filter(x => x && !STOP.has(x)).map(stem);
function lev(a,b){
  if (Math.abs(a.length-b.length) > 2) return 9;
  let prev = Array.from({length:b.length+1},(_,i)=>i);
  for (let i=1;i<=a.length;i++){ const cur=[i];
    for (let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    prev=cur; }
  return prev[b.length];
}
const compile = str => (str||"").split(",").map(s=>s.trim()).filter(Boolean).map(t => t.includes(" ") ? {phrase:norm(t)} : {stem:stem(t)});
function compileEntry(e){ for (const L of [e.lex, e.etyLex]){
  if (!L) continue;
  L.concepts.forEach(c => { c.S = compile(c.s); c.P = compile(c.p); });
  if (L.decoys) L.decoys.T = compile(L.decoys.terms);
  if (L.alt) L.alt.T = compile(L.alt.terms);
  if (L.syn) L.SYN = compile(L.syn);
  if (L.hyper) L.HYPER = compile(L.hyper);
  if (L.alt2) L.alt2.concepts.forEach(c => { c.S = compile(c.s); c.P = compile(c.p); }); } }
for (const k in DB.words) compileEntry(DB.words[k]);
function hits(terms, gN, gS){
  return terms.some(t => t.phrase ? gN.includes(t.phrase)
    : gS.some(g => g === t.stem || (t.stem.length >= 5 && g.length >= 5 && lev(g, t.stem) <= (t.stem.length >= 8 ? 2 : 1))));
}
const listJoin = a => a.length < 2 ? a[0] : a.slice(0,-1).join(", ") + " and " + a[a.length-1];
function scoreGuess(entry, guess){
  const L = entry.lex, gN = norm(guess), gS = toks(guess);
  if (!gS.length) return {score:0, feedback:"Nothing to judge, darling."};
  if (entry.mode === "meant"){
    const c = L.concepts[0];
    if (hits(compile(entry.target), gN, gS)) return {score:100, feedback:`Spot on: the word was ${entry.target}.`};
    if (L.alt && hits(L.alt.T, gN, gS)) return {score:L.alt.score, feedback:L.alt.msg};
    if (hits(c.S, gN, gS)) return {score:85, feedback:`Right idea. The exact word was ${entry.target}.`};
    if (hits(c.P, gN, gS)) return {score:55, feedback:`You're in the neighbourhood. The word was ${entry.target}.`};
    if (L.decoys && hits(L.decoys.T, gN, gS)) return {score:5, feedback:L.decoys.msg};
    return {score:3, feedback:`Not this time. The word was ${entry.target}.`};
  }
  if (L.SYN && hits(L.SYN, gN, gS)) return {score:100, feedback:"Spot on: that's a true synonym."};
  let best = scoreConcepts(L, gN, gS);
  if (L.alt2){ const r2 = scoreConcepts(L.alt2, gN, gS); if (r2.score > best.score) best = {...r2, feedback: r2.feedback + " (That's its other meaning.)"}; }
  if (L.HYPER && best.score < 70 && hits(L.HYPER, gN, gS)) best = {score:70, feedback:`Close: it's a kind of ${L.hyperLabel}.`};
  if (L.syn && best.score < 70 && gS.some(g => g.length >= 6 && L.syn.includes(g))) best = {score:70, feedback:`Very close. Its synonyms include ${L.syn.split(", ").slice(0,3).join(", ")}.`};
  return best;
}
function scoreEty(entry, guess){
  const gN = norm(guess), gS = toks(guess);
  if (!gS.length) return {score:0, feedback:"Nothing to judge, darling."};
  return scoreConcepts(entry.etyLex, gN, gS);
}
function expandGuess(gS, gN){
  if (!THES || THES.failed) return [];
  const out = [];
  for (const raw of gN.trim().split(" ")){
    if (!raw || STOP.has(raw)) continue;
    const k = THES.syn[raw] ? raw : THES.forms[raw];
    if (k) THES.syn[k].split("|").forEach(x => { if (!x.includes(" ")) out.push(stem(x)); });
  }
  return out;
}
function scoreConcepts(L, gN, gS){
  const got = [], missed = []; let raw = 0;
  const gX = expandGuess(gS, gN);
  L.concepts.forEach(c => {
    const m = hits(c.S, gN, gS) ? 1 : (hits(c.P, gN, gS) || (gX.length && hits(c.S, gN, gX))) ? .6 : 0;
    raw += c.w * m;
    if (m) got.push(m === 1 ? c.label : c.label + " (roughly)"); else missed.push(c.label);
  });
  raw = Math.min(1, raw / (L.cap || 1));
  const score = Math.round(raw * 100);
  if (L.alt && hits(L.alt.T, gN, gS) && score < L.alt.score) return {score:L.alt.score, feedback:L.alt.msg};
  if (L.decoys && raw < .5 && hits(L.decoys.T, gN, gS)) return {score:Math.min(score,10), feedback:L.decoys.msg};
  const feedback = !got.length ? `Nothing here pointed to ${L.concepts[0].label}.`
    : (!missed.length || score >= 100) ? `You got ${listJoin(got)}.` : `You got ${listJoin(got)}, but missed ${listJoin(missed)}.`;
  return {score: got.length ? score : 2, feedback};
}

/* ===== Thesaurus: unusual synonyms ===== */
function fancy(word){
  if (!THES) return null;
  const w = word.toLowerCase().replace(/[^a-z-]/g,""); if (w.length < 3) return null;
  let k = THES.syn[w] ? w : THES.forms[w];
  if (!k) for (const [suf,rep] of [["ies","y"],["es",""],["s",""],["ied","y"],["ed",""],["ed","e"],["ing",""],["ing","e"],["ly",""],["er",""]]){
    if (w.endsWith(suf)){ const b = w.slice(0,-suf.length)+rep; if (THES.syn[b]){ k = b; break; } } }
  return k ? {head:k, list:THES.syn[k].split("|")} : null;
}
function synonymsFor(text){
  const seen = new Set(), out = [];
  for (const raw of norm(text).trim().split(" ")){
    if (!raw || STOP.has(raw) || seen.has(raw)) continue; seen.add(raw);
    const f = fancy(raw); if (f && !out.some(o => o.head === f.head)) out.push(f);
    if (out.length >= 4) break;
  }
  return out;
}

        html += `<div class="banner">${d > 0 ? `You beat your friend by <b>${d}</b>.` : d < 0 ? `Your friend wins by <b>${-d}</b>. Tomorrow, perhaps.` : "A dead heat. How theatrical."}</div>`;
      }
      if (daily){
        html += `<h3 id="sh">Send it to a friend</h3>
          <pre class="share" id="sharetext">${esc(shareText(r))}</pre>
          <div class="row"><button class="primary" id="share">Share</button><button id="copy">Copy</button></div>
          <div class="toast" id="toast" role="status"></div>`;
      }
      html += `</section>`;
      if (!THES) loadThes().then(() => { if (phase === "done") render(); });
      const syn = r.guess ? synonymsFor(r.guess + " " + (r.eguess || "")) : [];
      html += `<section class="section"><h3>Say it like Moira</h3>
        ${!THES ? `<p class="muted">Opening the dictionary…</p>` : THES.failed ? `<p class="muted">The dictionary couldn't load. Reload to try again.</p>` : syn.length ? `<p class="muted">Your guesses, upgraded with rarer synonyms:</p>` + syn.map(s =>
          `<div class="syn"><div class="head">for <b>${esc(s.head)}</b></div><div class="chips">${s.list.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div></div>`).join("")
          : `<p class="muted">${r.guess ? "No rarer synonyms for your words this time." : "Type any everyday word to find its grander alternatives."}</p>`}
        <label for="lookup">Find a grander word for…</label>
        <input type="text" id="lookup" placeholder="e.g. silly, rich, angry, chat" autocomplete="off">
        <div id="lookupOut" class="syn"></div></section>`;
      html += `<div class="row">${daily
          ? `<span class="muted">Next word in <b id="cd">${countdown()}</b></span><button id="practice">Practise another word</button>`
          : E.study ? `<button class="primary" id="practice">Next word</button>`
          : `<button class="primary" id="practice">Another practice word</button><button id="back">Back to today's word</button>`}</div>`;
    }
  }
  if (phase !== "guess") html += reportBox();
  st.innerHTML = html;
  wire(e);
  if (phase !== "guess") wireReport(e, key);
}

function draftBox(id, suffix){
  const ta = $(id); if (!ta) return;
  const dk = "draft-" + ed + "-" + curKey() + suffix;
  try { ta.value = sessionStorage.getItem(dk) || ""; } catch(err){}
  ta.oninput = () => { try { sessionStorage.setItem(dk, ta.value); } catch(err){} };
}

function wire(e){
  if (phase === "guess"){
    draftBox("#guess", "");
    $("#guess").onkeydown = ev => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) submit(); };
    $("#go").onclick = submit;
    if ($("#hint")) $("#hint").onclick = () => { const v = $("#guess").value; hintShown = true; render(); $("#guess").value = v; };
    $("#skip").onclick = () => save({guess:"", score:0, feedback:"Skipped. Now you'll never forget it.", hint:false, stage: e.noEty ? "done" : "ety"});
    return;
  }
  if (phase === "ety"){
    draftBox("#eguess", "-ety");
    $("#eguess").onkeydown = ev => { if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)) submitEty(); };
    $("#ego").onclick = submitEty;
    $("#eskip").onclick = () => save({...curRes(), eguess:"", escore:0, efeedback:"Skipped. The story's below.", stage:"done"});
    return;
  }
  if ($("#share")) $("#share").onclick = async () => {
    const text = $("#sharetext").textContent;
    if (navigator.share){ try { await navigator.share({text}); return; } catch(err){ if (err && err.name === "AbortError") return; } }
    copy(text);
  };
  if ($("#copy")) $("#copy").onclick = () => copy($("#sharetext").textContent);
  const lk = $("#lookup");
  lk.oninput = () => {
    const f = fancy(lk.value.trim());
    $("#lookupOut").innerHTML = !lk.value.trim() ? "" : f
      ? `<div class="head">for <b>${esc(f.head)}</b></div><div class="chips">${f.list.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`
      : `<p class="muted">No grander synonym on file for that one. Try a simpler everyday word.</p>`;
  };
  $("#practice").onclick = () => {
    const E2 = DB.editions[ed], pool = edOrder(ed).filter(k => k !== practiceKey && !isHidden(k) && (E2.study || k !== dailyKey(ed)));
    practiceKey = pool[Math.floor(Math.random()*pool.length)]; practiceRes = null;
    mode = "practice"; hintShown = false; render(); window.scrollTo({top:0});
  };
  if ($("#back")) $("#back").onclick = () => { mode = "daily"; hintShown = false; render(); window.scrollTo({top:0}); };
}

function copy(text){
  const t = $("#toast");

    const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected. Copy it and send it to a friend."; };
  try { navigator.clipboard.writeText(text).then(() => t.textContent = "Copied. Paste it to a friend.", fallback); }
  catch(err){ fallback(); }
}

function submit(){

const ISSUES_URL = "https://github.com/ThomasSchmierer/Moira-Lexicon/issues/new";

let HIDDEN = new Set(store.get("ml-hidden", []));
const isHidden = k => HIDDEN.has(k);

function plain(s){ return String(s || "").replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">"); }
function reportText(e, key, reason, note){
  return `**Word:** ${e.w}\n**Problem:** ${reason}\n**Edition:** ${DB.editions[ed].name}\n**Definition shown:** ${plain(e.def)}\n` +
    (e.line ? `**Line:** ${plain(e.line)}\n` : "") + (e.to ? `**Source:** ${plain(e.to)}\n` : "") + `**Entry key:** ${key}\n` + (note ? `\n${note}\n` : "");
}
function reportBox(){

    <div class="chips" role="radiogroup" aria-label="What's wrong?">${REPORT_REASONS.map((r, i) =>
      `<button class="chip rp-r${i === 0 ? " on" : ""}" role="radio" aria-checked="${i === 0}" data-r="${esc(r)}">${esc(r)}</button>`).join("")}</div>

    <p class="muted">Reports open as an issue on the game's GitHub page, which needs a free GitHub account. No account? Copy the report and pass it on.</p>

}
function wireReport(e, key){

  let reason = REPORT_REASONS[0];
  const update = () => {
    $("#rp-send").href = ISSUES_URL + "?title=" + encodeURIComponent(`Word report: ${e.w} (${reason})`) + "&body=" + encodeURIComponent(reportText(e, key, reason, $("#rp-note").value.trim()));

const letters = e => e.w.toUpperCase().replace(/[^A-Z]/g, "");
const stripTags = s => String(s || "").replace(/<[^>]+>/g, "");
function maskWord(text, e){
  let t = stripTags(text);
  const forms = [e.w, ...(e.w.split(/[\s(]/)[0] ? [e.w.split(/[\s(]/)[0]] : [])];
  forms.forEach(f => { if (f.length > 2) t = t.replace(new RegExp(f.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\w*", "gi"), "_____"); });
  return t;
}

function clueLine(e){

function pool(minLen, maxLen){

/* ---------- Hangman: the scaffold goes up, then the stick figure, one stroke per miss ---------- */
const HM_PARTS = [
  '<path d="M20 205H125"/>', '<path d="M48 205V20"/>', '<path d="M48 20H142M48 52L80 20"/>', '<path d="M142 20V44"/>',
  '<circle cx="142" cy="61" r="17"/>', '<path d="M142 78V135"/>', '<path d="M142 96L118 118"/>', '<path d="M142 96L166 118"/>',
  '<path d="M142 135L121 172"/>', '<path d="M142 135L163 172"/>'];
const HM_MAX = HM_PARTS.length;
function newHangman(){
  const p = pool(3, 30); const e = p[Math.floor(Math.random()*p.length)];
  G.hm = {e, guessed:new Set(), wrong:0, hints:0, done:false, won:false, ed, fresh:-1};
}
function gallows(h){
  const shown = h.done && !h.won ? HM_MAX : h.wrong;
  const parts = HM_PARTS.slice(0, shown).map((p, i) => p.replace(/^<(\w+)/, `<$1 pathLength="1"${i === h.fresh ? ' class="draw"' : ""}`)).join("");
  return `<svg viewBox="0 0 190 215" class="gallows${h.done && !h.won ? " lost" : ""}" role="img" aria-label="${HM_MAX - h.wrong} misses left">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">${parts}</g></svg>`;
}
function renderHangman(st){
  if (!G.hm || G.hm.ed !== ed) newHangman();
  const h = G.hm, e = h.e, stats = gameStats("hangman");
  const shown = e.w.toUpperCase().split("").map(ch => /[A-Z]/.test(ch)
      ? `<span class="hm-l${h.done && !h.guessed.has(ch) ? " miss" : ""}">${h.guessed.has(ch) || h.done ? ch : ""}</span>`
      : `<span class="hm-gap">${ch === " " ? "" : esc(ch)}</span>`).join("");
  const keys = "QWERTYUIOPASDFGHJKLZXCVBNM".split("").map(k => {
    const used = h.guessed.has(k), good = used && letters(e).includes(k);
    return `<button class="key${used ? (good ? " good" : " bad") : ""}" data-k="${k}" ${used || h.done ? "disabled" : ""} aria-label="${k}">${k}</button>`;
  }).join("");
  const showHint1 = h.hints >= 1 || h.done, showHint2 = h.hints >= 2 && !h.done;
  st.innerHTML = `<div class="eyebrow">Hangman · ${esc(DB.editions[ed].name)} · won ${stats.won} of ${stats.played}</div>
    <div class="hm-top">${gallows(h)}<div class="hm-side">
      <div class="hm-count"><b>${HM_MAX - h.wrong}</b> misses left</div>
      <div class="hm-word" aria-label="The word">${shown}</div></div></div>
    <div class="hints">
      ${showHint1 ? `<div class="hint-card"><div class="eyebrow">Hint 1 · the definition</div>${clueBlock(e)}</div>` : ""}
      ${showHint2 ? `<div class="hint-card"><div class="eyebrow">Hint 2 · the origin</div>${originBlock(e)}<p class="muted">${esc(maskWord(e.ety, e))}</p></div>` : ""}
      ${!h.done && h.hints < (e.noEty ? 1 : 2) ? `<div class="row"><button id="hm-hint">${h.hints === 0 ? "Hint 1: the definition" : "Hint 2: the origin"}</button></div>` : ""}
    </div>
    ${h.done ? `<div class="banner">${h.won ? `<b>Bravo.</b> ${esc(e.w)}, with ${h.wrong} miss${h.wrong === 1 ? "" : "es"}${h.hints ? ` and ${h.hints} hint${h.hints > 1 ? "s" : ""}` : ""}.` : `Too late. The word was <b>${esc(e.w)}</b>.`} ${pronLink(e)}</div>
      <section class="section"><div><h3>Definition</h3><p class="def">${e.def}</p>${checkedNote(e)}</div>${e.ctx ? `<div><h3>In context</h3>${ctxBlock(e)}</div>` : e.line ? `<div><h3>The line</h3>${quote(e)}</div>` : ""}${alsoBlock(e, true)}
      ${e.noEty ? "" : `<div><h3>Etymology</h3><p>${e.ety}</p></div>${originBlock(e)}`}${gifLinks(e)}</section>
      ${reportBox()}<div class="row"><button class="primary" id="hm-next">Next word</button></div>`
    : `<div class="keys" role="group" aria-label="Letters">${keys}</div>`}`;
  h.fresh = -1;
  st.querySelectorAll(".key").forEach(b => b.onclick = () => hmGuess(b.dataset.k));
  if ($("#hm-hint")) $("#hm-hint").onclick = () => { h.hints++; renderHangman(st); };
  if ($("#hm-next")) $("#hm-next").onclick = () => { newHangman(); renderHangman(st); window.scrollTo({top:0}); };
  if (h.done) wireReport(e, keyOf(e));
}
function hmGuess(k){
  const h = G.hm; if (!h || h.done || h.guessed.has(k)) return;
  h.guessed.add(k);
  const need = new Set(letters(h.e).split(""));
  if (!need.has(k)){ h.wrong++; h.fresh = h.wrong - 1; }
  if ([...need].every(c => h.guessed.has(c))){ h.done = true; h.won = true; recordGame("hangman", true); }
  else if (h.wrong >= HM_MAX){ h.done = true; recordGame("hangman", false); }
  renderHangman($("#stage"));
}
document.addEventListener("keydown", ev => {
  if (gameMode !== "hangman" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName)) return;
  if (/^[a-z]$/i.test(ev.key)) hmGuess(ev.key.toUpperCase());
});

/* ---------- Word search: everyday words to find, the lexicon's big words hidden as bonuses ---------- */
const WS_DIRS = [[0,1],[1,0],[1,1],[-1,1]];
const WS_COMMON = "BOOK DRAMA STAGE CURTAIN WIG GOWN PEARL ROSE WINE TEA CAKE CHAIR DOOR LAMP HAT COAT SHOE SCARF RING CROWN QUEEN KING STAR MOON SONG DANCE CLOWN JOKE LAUGH SMILE FRIEND HOUSE MOTEL TOWN ROAD RIVER STORM CLOUD RAIN SNOW TREE LEAF APPLE BREAD HONEY SUGAR SALT PEPPER PIANO DRUM BELL CANDLE MIRROR PARTY DINNER LUNCH TOAST DIARY LETTER STAMP".split(" ");
function wsSize(){ return Math.max(9, Math.min(12, Math.floor(((window.innerWidth || 400) - 40) / 29))); }
function buildSearch(items, size){
  for (let attempt = 0; attempt < 60; attempt++){
    const grid = Array.from({length:size}, () => Array(size).fill(""));
    const placed = [];
    for (const it of items){
      const L = it.L; let ok = false;
      for (let t = 0; t < 300 && !ok; t++){
        const [dr, dc] = WS_DIRS[Math.floor(Math.random()*WS_DIRS.length)];
        const r0 = Math.floor(Math.random()*size), c0 = Math.floor(Math.random()*size);
        const rEnd = r0 + dr*(L.length-1), cEnd = c0 + dc*(L.length-1);
        if (rEnd < 0 || rEnd >= size || cEnd >= size) continue;
        let fits = true;
        for (let i = 0; i < L.length; i++){ const g = grid[r0+dr*i][c0+dc*i]; if (g && g !== L[i]) { fits = false; break; } }
        if (!fits) continue;
        const cells = [];
        for (let i = 0; i < L.length; i++){ grid[r0+dr*i][c0+dc*i] = L[i]; cells.push([r0+dr*i, c0+dc*i]); }
        placed.push({...it, cells, found:false}); ok = true;
      }
    }
    const bonusOk = placed.filter(p => p.kind === "bonus").length >= Math.min(2, items.filter(i => i.kind === "bonus").length);
    if (bonusOk && placed.length >= Math.min(items.length, 8)){
      const fill = "EEEEAAAIIOOUTTNNSSRRLLDDHCMPGBFYWKV";
      for (const row of grid) for (let c = 0; c < size; c++) if (!row[c]) row[c] = fill[Math.floor(Math.random()*fill.length)];
      return {grid, placed, size};
    }
  }
  return null;
}
function newSearch(){
  const size = wsSize();
  const bonus = [], seen = new Set();
  for (const e of shuffle(pool(5, size))){ const L = letters(e); if (!seen.has(L)){ bonus.push({L, e, kind:"bonus"}); seen.add(L); } if (bonus.length === 3) break; }
  // everyday words: plain synonyms from the bonus words' own meanings first, then a stock list
  const everyday = [];
  const add = w => { w = w.toUpperCase(); if (/^[A-Z]{3,7}$/.test(w) && !seen.has(w) && !bonus.some(b => b.L.includes(w))){ everyday.push({L:w, kind:"word"}); seen.add(w); } };
  bonus.forEach(b => shuffle(b.e.lex.concepts.flatMap(c => c.s.split(",").map(x => x.trim()))).slice(0, 6).forEach(add));
  shuffle(WS_COMMON).forEach(w => { if (everyday.length < 9) add(w); });
  const items = [...bonus.sort((a,b) => b.L.length - a.L.length), ...everyday.slice(0, 9)];
  const built = buildSearch(items, size);
  G.ws = built ? {...built, sel:null, ed, done:false, extras:[], extraCells:new Set()} : null;
}
function renderSearch(st){
  if (!G.ws || G.ws.ed !== ed) newSearch();
  const w = G.ws; if (!w){ st.innerHTML = `<p class="loading">Not enough words in this edition for a word search.</p>`; return; }
  const cellsOf = kind => new Set(w.placed.filter(p => p.found && p.kind === kind).flatMap(p => p.cells.map(c => c.join(","))));
  const fw = cellsOf("word"), fb = cellsOf("bonus"), stats = gameStats("search");
  const words = w.placed.filter(p => p.kind === "word"), bonus = w.placed.filter(p => p.kind === "bonus");
  st.innerHTML = `<div class="eyebrow">Word search · ${esc(DB.editions[ed].name)} · solved ${stats.won}</div>
    <p class="muted">Tap the first letter of a word, then the last. Words run across, down or diagonally. Find the everyday words, then hunt for the bonus words from their clues.</p>
    <div class="ws" role="grid" aria-label="Letter grid" style="--n:${w.size}">${w.grid.map((row, r) => row.map((ch, c) => {
      const k = r+","+c, cls = fb.has(k) ? " bonus" : fw.has(k) ? " found" : w.extraCells.has(k) ? " extra" : "";
      return `<button class="ws-c${cls}${w.sel && w.sel[0] === r && w.sel[1] === c ? " sel" : ""}" data-r="${r}" data-c="${c}" aria-label="${ch}">${ch}</button>`; }).join("")).join("")}</div>
    <div class="toast" id="wsmsg" role="status"></div>
    <div><h3 class="ws-h">Find these ${words.filter(p => p.found).length}/${words.length}</h3>
      <div class="chips">${words.map(p => `<span class="chip ws-w${p.found ? " done" : ""}">${p.L.toLowerCase()}</span>`).join("")}</div></div>
    <div><h3 class="ws-h">Bonus words ${bonus.filter(p => p.found).length}/${bonus.length}</h3>
      <ol class="clues">${bonus.map(p => `<li class="${p.found ? "done" : ""}">${p.found ? `<b class="ans">${esc(p.e.w)}</b> ` : `<span class="muted">(${p.L.length} letters)</span> `}${clueBlock(p.e)}</li>`).join("")}</ol></div>
    ${w.extras.length ? `<div><h3 class="ws-h">Extra words you spotted</h3><div class="chips">${w.extras.map(x => `<span class="chip">${x}</span>`).join("")}</div></div>` : ""}
    <div class="row">${w.done ? `<span class="banner"><b>${bonus.every(p => p.found) ? "Every word, bonuses included." : "All the everyday words found."}</b> ${bonus.every(p => p.found) ? "Splendid." : "Can you find the bonus words too?"}</span>` : ""}
      <button class="primary" id="ws-new">New puzzle</button></div>`;
  st.querySelectorAll(".ws-c").forEach(b => b.onclick = () => wsTap(+b.dataset.r, +b.dataset.c));
  $("#ws-new").onclick = () => { newSearch(); renderSearch(st); window.scrollTo({top:0}); };
}
function wsIsWord(s){
  if (!THES || THES.failed || s.length < 4) return false;
  const l = s.toLowerCase(); return !!(THES.syn[l] || THES.forms[l]);
}
function wsTap(r, c){
  const w = G.ws;
  if (!w.sel){ w.sel = [r, c]; renderSearch($("#stage")); return; }
  const [r0, c0] = w.sel; w.sel = null;
  const dr = Math.sign(r - r0), dc = Math.sign(c - c0), len = Math.max(Math.abs(r - r0), Math.abs(c - c0)) + 1;
  const straight = (r0 === r || c0 === c || Math.abs(r - r0) === Math.abs(c - c0)) && len > 1;
  let msg = "Pick the first and last letters in a straight line.";
  if (straight){
    const cells = Array.from({length:len}, (_, i) => [r0 + dr*i, c0 + dc*i]);
    const s = cells.map(([a,b]) => w.grid[a][b]).join(""), rev = [...s].reverse().join("");
    const hit = w.placed.find(p => !p.found && (p.L === s || p.L === rev));
    if (hit){ hit.found = true; hit.cells = cells; msg = hit.kind === "bonus" ? `Bonus word: ${hit.e.w}!` : `Found: ${hit.L.toLowerCase()}`; }
    else {
      const word = wsIsWord(s) ? s : wsIsWord(rev) ? rev : null;
      if (word && !w.extras.includes(word.toLowerCase()) && !w.placed.some(p => p.L === word)){
        w.extras.push(word.toLowerCase()); cells.forEach(x => w.extraCells.add(x.join(",")));
        msg = `An extra word: ${word.toLowerCase()}. Not on the list, but well spotted.`;
      } else msg = "Not one of the words. Try again.";
    }
  }
  if (!w.done && w.placed.filter(p => p.kind === "word").every(p => p.found)){ w.done = true; recordGame("search", true); }
  renderSearch($("#stage"));
  const m = $("#wsmsg"); if (m) m.textContent = msg;
}

/* ---------- Crossword: generated fresh from the edition's words ---------- */
function genCrossword(words, maxWords = 10, maxDim = 13){
  let best = null;
  for (let attempt = 0; attempt < 30; attempt++){
    const cand = shuffle(words).slice(0, 40).sort((a,b) => letters(b).length - letters(a).length);
    const cells = new Map(), placed = [];
    const at = (r,c) => cells.get(r+","+c);
    const put = (e, r, c, dir) => {
      const L = letters(e);
      for (let i = 0; i < L.length; i++){ const k = (r + (dir==="d"?i:0)) + "," + (c + (dir==="a"?i:0)); const cell = cells.get(k) || {ch:L[i], dirs:new Set()}; cell.dirs.add(dir); cells.set(k, cell); }
      placed.push({e, L, r, c, dir});
    };
    const bounds = () => { let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9; for (const k of cells.keys()){ const [r,c] = k.split(",").map(Number); r0=Math.min(r0,r); r1=Math.max(r1,r); c0=Math.min(c0,c); c1=Math.max(c1,c); } return {r0,r1,c0,c1}; };
    const fits = (L, r, c, dir) => {
      const dr = dir==="d"?1:0, dc = dir==="a"?1:0; let cross = 0;
      if (at(r-dr, c-dc) || at(r+dr*L.length, c+dc*L.length)) return -1;
      for (let i = 0; i < L.length; i++){
        const rr = r+dr*i, cc = c+dc*i, cell = at(rr, cc);
        if (cell){ if (cell.ch !== L[i] || cell.dirs.has(dir)) return -1; cross++; }
        else if (dir==="a" ? (at(rr-1,cc) || at(rr+1,cc)) : (at(rr,cc-1) || at(rr,cc+1))) return -1;
      }
      const b = bounds();
      const nr0 = Math.min(b.r0, r), nr1 = Math.max(b.r1, r+dr*(L.length-1)), nc0 = Math.min(b.c0, c), nc1 = Math.max(b.c1, c+dc*(L.length-1));
      if (nr1-nr0+1 > maxDim || nc1-nc0+1 > maxDim) return -1;
      return cross;
    };
    const used = new Set();
    put(cand[0], 0, 0, "a"); used.add(letters(cand[0]));
    for (const e of cand.slice(1)){
      if (placed.length >= maxWords) break;
      const L = letters(e); if (used.has(L)) continue;
      let bestSpot = null;
      for (const [k, cell] of cells){
        const [r, c] = k.split(",").map(Number);
        for (let i = 0; i < L.length; i++){
          if (L[i] !== cell.ch) continue;
          for (const dir of ["a","d"]){
            if (cell.dirs.has(dir)) continue;
            const r0 = dir==="d" ? r-i : r, c0 = dir==="a" ? c-i : c, score = fits(L, r0, c0, dir);
            if (score > 0 && (!bestSpot || score > bestSpot.score)) bestSpot = {r:r0, c:c0, dir, score};
          }
        }
      }
      if (bestSpot){ put(e, bestSpot.r, bestSpot.c, bestSpot.dir); used.add(L); }
    }
    if (!best || placed.length > best.placed.length){
      const b = bounds();
      best = {placed: placed.map(p => ({...p, r:p.r-b.r0, c:p.c-b.c0})), rows:b.r1-b.r0+1, cols:b.c1-b.c0+1};
    }
    if (best.placed.length >= maxWords) break;
  }
  // number the clues
  const starts = [...new Set(best.placed.map(p => p.r+","+p.c))].map(k => k.split(",").map(Number)).sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const num = new Map(starts.map((s, i) => [s.join(","), i+1]));
  best.placed.forEach(p => p.num = num.get(p.r+","+p.c));
  best.solution = new Map();
  best.placed.forEach(p => { for (let i = 0; i < p.L.length; i++) best.solution.set((p.r+(p.dir==="d"?i:0))+","+(p.c+(p.dir==="a"?i:0)), p.L[i]); });
  best.num = num;
  return best;
}
function newCross(){
  const cw = genCrossword(pool(3, 11));
  G.cw = {...cw, fill:new Map(), cur:null, dir:"a", wrong:new Set(), done:false, ed};
}
function cwWordAt(r, c, dir){
  return G.cw.placed.find(p => p.dir === dir && (dir==="a" ? (p.r===r && c>=p.c && c<p.c+p.L.length) : (p.c===c && r>=p.r && r<p.r+p.L.length)));
}
function renderCross(st){
  if (!G.cw || G.cw.ed !== ed) newCross();
  const w = G.cw, stats = gameStats("cross");
  if (w.placed.length < 3){ st.innerHTML = `<p class="loading">Not enough words in this edition for a crossword.</p>`; return; }
  const curWord = w.cur ? (cwWordAt(w.cur[0], w.cur[1], w.dir) || cwWordAt(w.cur[0], w.cur[1], w.dir==="a"?"d":"a")) : null;
  if (curWord) w.dir = curWord.dir;
  const inCur = (r,c) => curWord && (curWord.dir==="a" ? (r===curWord.r && c>=curWord.c && c<curWord.c+curWord.L.length) : (c===curWord.c && r>=curWord.r && r<curWord.r+curWord.L.length));
  let cells = "";
  for (let r = 0; r < w.rows; r++) for (let c = 0; c < w.cols; c++){
    const k = r+","+c;
    if (!w.solution.has(k)){ cells += `<div class="cw-x" aria-hidden="true"></div>`; continue; }
    const n = w.num.get(k), v = w.fill.get(k) || "", isCur = w.cur && w.cur[0]===r && w.cur[1]===c;
    cells += `<button class="cw-c${isCur ? " cur" : inCur(r,c) ? " word" : ""}${w.wrong.has(k) ? " wrong" : ""}" data-r="${r}" data-c="${c}" aria-label="Row ${r+1} column ${c+1}${v ? ", " + v : ""}">${n ? `<i>${n}</i>` : ""}${v}</button>`;
  }
  const list = dir => w.placed.filter(p => p.dir===dir).sort((a,b) => a.num-b.num).map(p =>
    `<li class="${curWord===p ? "cur" : ""}"><button class="cw-clue" data-r="${p.r}" data-c="${p.c}" data-d="${p.dir}"><b>${p.num}</b> ${esc(clueDef(p.e))} <span class="muted">(${p.L.length})</span></button></li>`).join("");
  st.innerHTML = `<div class="eyebrow">Crossword · ${esc(DB.editions[ed].name)} · solved ${stats.won}</div>
    ${curWord ? `<div class="cw-bar"><b>${curWord.num} ${curWord.dir==="a" ? "across" : "down"}</b> ${clueBlock(curWord.e)}</div>` : `<p class="muted">Tap a square or a clue to start. Tap the same square again to switch between across and down.</p>`}
    <div class="cw-wrap"><div class="cw" style="--cols:${w.cols};--rows:${w.rows}">${cells}</div></div>
    <input id="cw-in" class="cw-in" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Type a letter">
    ${w.done ? `<div class="banner"><b>Solved.</b> A triumph, darling.</div>` : ""}
    <div class="row"><button id="cw-check">Check</button><button id="cw-reveal" ${curWord ? "" : "disabled"}>Reveal word</button><button class="primary" id="cw-new">New crossword</button></div>
    <div class="cw-lists"><div><h3>Across</h3><ol>${list("a")}</ol></div><div><h3>Down</h3><ol>${list("d")}</ol></div></div>`;
  st.querySelectorAll(".cw-c").forEach(b => b.onclick = () => {
    const r = +b.dataset.r, c = +b.dataset.c;
    if (w.cur && w.cur[0]===r && w.cur[1]===c) w.dir = w.dir==="a" ? "d" : "a";
    else if (!cwWordAt(r, c, w.dir)) w.dir = w.dir==="a" ? "d" : "a";
    w.cur = [r, c]; renderCross(st); cwFocus();
  });
  st.querySelectorAll(".cw-clue").forEach(b => b.onclick = () => { w.cur = [+b.dataset.r, +b.dataset.c]; w.dir = b.dataset.d; renderCross(st); cwFocus(); });
  $("#cw-new").onclick = () => { newCross(); renderCross(st); };
  $("#cw-check").onclick = () => { w.wrong = new Set([...w.fill].filter(([k,v]) => v && w.solution.get(k) !== v).map(([k]) => k)); renderCross(st); };
  if (curWord) $("#cw-reveal").onclick = () => { for (let i = 0; i < curWord.L.length; i++){ const k = (curWord.r+(curWord.dir==="d"?i:0))+","+(curWord.c+(curWord.dir==="a"?i:0)); w.fill.set(k, curWord.L[i]); w.wrong.delete(k); } cwCheckDone(); renderCross(st); };
  const inp = $("#cw-in");
  inp.oninput = () => { const ch = inp.value.slice(-1).toUpperCase(); inp.value = ""; if (/[A-Z]/.test(ch)) cwType(ch); };
  inp.onkeydown = ev => {
    if (ev.key === "Backspace"){ ev.preventDefault(); cwBack(); }
    else if (ev.key.startsWith("Arrow")){ ev.preventDefault(); cwMove(ev.key); }
  };
}
function cwFocus(){ const i = $("#cw-in"); if (i) try { i.focus({preventScroll:true}); } catch(err){ i.focus(); } }
function cwStep(delta){
  const w = G.cw; if (!w.cur) return;
  const [r, c] = w.cur, nr = r + (w.dir==="d"?delta:0), nc = c + (w.dir==="a"?delta:0);
  if (w.solution.has(nr+","+nc)) w.cur = [nr, nc];
}
function cwType(ch){
  const w = G.cw; if (!w.cur) return;
  const k = w.cur.join(","); w.fill.set(k, ch); w.wrong.delete(k);
  cwStep(1); cwCheckDone(); renderCross($("#stage")); cwFocus();
}
function cwBack(){
  const w = G.cw; if (!w.cur) return;
  const k = w.cur.join(",");
  if (w.fill.get(k)) w.fill.delete(k); else { cwStep(-1); w.fill.delete(w.cur.join(",")); }
  renderCross($("#stage")); cwFocus();
}
function cwMove(key){
  const w = G.cw; if (!w.cur) return;
  const d = {ArrowRight:[0,1], ArrowLeft:[0,-1], ArrowDown:[1,0], ArrowUp:[-1,0]}[key];
  w.dir = d[0] ? "d" : "a";
  let [r, c] = w.cur;
  for (let i = 0; i < 13; i++){ r += d[0]; c += d[1]; if (w.solution.has(r+","+c)){ w.cur = [r, c]; break; } }
  renderCross($("#stage")); cwFocus();
}
function cwCheckDone(){
  const w = G.cw;
  if (!w.done && [...w.solution].every(([k, v]) => w.fill.get(k) === v)){ w.done = true; recordGame("cross", true); }
}

setInterval(() => { const c = $("#cd"); if (c) c.textContent = countdown(); }, 30000);
window.addEventListener("hashchange", () => { friend = null; parseHash(); mode = "daily"; hintShown = false; render(); });
$("#home-link").onclick = ev => { ev.preventDefault(); try { history.pushState(null, "", location.pathname); } catch(err){} view = "home"; render(); };
/* Words added with the harvester (tools/harvest.py) live in extra-words.json */
function loadExtras(){
  return fetch("extra-words.json").then(r => r.ok ? r.json() : null).then(d => {
    if (!d) return;
    Object.assign(DB.shows, d.shows || {});
    for (const [k, e] of Object.entries(d.words || {})){
      compileEntry(e); const key = "x:" + k; DB.words[key] = e;
      const eds = e.editions || ["all"];
      if (eds.includes("moira") && !eds.includes("all")) eds.push("all");
      for (const edk of eds){ const E = DB.editions[edk]; if (E && !E.src && !E.order.includes(key)) E.order.push(key); }
    }
  }).catch(() => {});
}
parseHash();
phase = "guess";
loadMore(ed);
loadExtras().finally(() => { render(); loadThes(); });
